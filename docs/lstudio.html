<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LStudio — Marée Morte</title>
<meta name="robots" content="noindex">
<style>
:root {
  --bg: #12161d; --panel: #1a2029; --panel2: #212834; --line: #2e3746; --text: #e6e9ef; --muted: #96a0b1; --accent: #e0a84a; --accent2: #3f9e7a; --primary: #3a7bd5; --danger: #d95b52; --warn: #e0a84a; --ok: #4fbf7f;
  --radius: 6px; font-synthesis: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; overflow: hidden; }
.hidden { display: none !important; }
button { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: var(--radius); padding: 5px 9px; cursor: pointer; white-space: nowrap; }
button:hover { border-color: #4a5568; background: #283142; }
button.on { background: #2f3e57; border-color: var(--primary); }
button.primary { background: var(--primary); border-color: var(--primary); }
button.accent { background: var(--accent2); border-color: var(--accent2); }
button.danger { background: #5a2a28; border-color: var(--danger); }
button.mini { padding: 1px 6px; font-size: 11px; }
button.wide { width: 100%; padding: 8px; }
button:disabled { opacity: 0.45; cursor: default; }
input, select, textarea { font: inherit; color: var(--text); background: #0f131a; border: 1px solid var(--line); border-radius: var(--radius); padding: 5px 7px; min-width: 0; }
input[type=checkbox] { padding: 0; }
input:focus, select:focus, textarea:focus { outline: 1px solid var(--primary); }
textarea { width: 100%; resize: vertical; }
.hint.warn { color: var(--warn); }
.tabs button { font-size: 12px; }
h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 14px 0 6px; display: flex; align-items: center; justify-content: space-between; }
#boot { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 9; }
.boot-box { width: 320px; text-align: center; color: var(--muted); }
.brand { font-weight: 700; color: var(--accent); letter-spacing: 0.02em; }
.brand.big { font-size: 28px; margin-bottom: 10px; }
.bar { height: 6px; background: var(--panel2); border-radius: 3px; overflow: hidden; margin-top: 12px; }
.bar i { display: block; height: 100%; width: 5%; background: var(--accent); transition: width 0.3s; }
#app { display: grid; grid-template-columns: 300px 1fr 300px; grid-template-rows: 46px 1fr; height: 100vh; }
#top { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; padding: 0 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
#top .group { display: flex; gap: 4px; }
#top .grow { flex: 1; }
#doc-name { width: 190px; background: transparent; border-color: transparent; font-weight: 600; }
#doc-name:hover, #doc-name:focus { border-color: var(--line); background: #0f131a; }
.state { color: var(--muted); font-size: 12px; margin-right: 4px; }
.state.dirty { color: var(--warn); }
aside { background: var(--panel); overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
#left { border-right: 1px solid var(--line); }
#right { border-left: 1px solid var(--line); }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; border: 0; border-radius: 0; background: transparent; padding: 9px 4px; color: var(--muted); }
.tabs button.on { color: var(--text); box-shadow: inset 0 -2px 0 var(--accent); }
.pane { display: none; padding: 10px; overflow-y: auto; flex: 1; min-height: 0; }
.pane.on { display: block; }
.row { display: flex; gap: 6px; align-items: center; margin: 6px 0; }
.row > input, .row > select { flex: 1; }
.chk { display: flex; gap: 6px; align-items: center; color: var(--muted); white-space: nowrap; }
#lib-search { width: 100%; }
.lib { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
.lib .it { background: var(--panel2); border: 1px solid var(--line); border-radius: var(--radius); padding: 4px; text-align: center; cursor: grab; user-select: none; }
.lib .it:hover { border-color: #4a5568; }
.lib .it.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.lib .it canvas { width: 100%; height: 56px; object-fit: contain; image-rendering: pixelated; display: block; }
.lib .it .n { font-size: 11px; line-height: 1.2; height: 2.4em; overflow: hidden; }
.lib .it .d { font-size: 10px; color: var(--muted); }
.lib .cat { grid-column: 1 / -1; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 8px; }
.seg { display: flex; flex-wrap: wrap; gap: 3px; }
.seg button { padding: 4px 7px; }
.plist { display: flex; flex-direction: column; gap: 2px; }
.plist .li { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: var(--radius); cursor: pointer; }
.plist .li:hover { background: var(--panel2); }
.plist .li.on { background: #2f3e57; }
.plist .sw { width: 16px; height: 16px; border-radius: 3px; border: 1px solid rgba(255,255,255,0.15); flex: none; }
.plist .li .x { margin-left: auto; color: var(--muted); font-size: 11px; }
.hint { color: var(--muted); font-size: 12px; }
#stage { position: relative; overflow: hidden; background: #0b1420; }
#map { width: 100%; height: 100%; display: block; outline: none; cursor: crosshair; }
#minimap { position: absolute; right: 10px; bottom: 34px; width: 240px; height: 140px; border: 1px solid var(--line); border-radius: var(--radius); background: #0b1420; cursor: pointer; image-rendering: pixelated; }
#status { position: absolute; left: 0; right: 0; bottom: 0; height: 24px; padding: 4px 10px; font-size: 12px; color: var(--muted); background: rgba(18,22,29,0.88); border-top: 1px solid var(--line); white-space: nowrap; overflow: hidden; }
#zoom { position: absolute; left: 10px; bottom: 34px; display: flex; align-items: center; gap: 4px; background: rgba(26,32,41,0.9); border: 1px solid var(--line); border-radius: var(--radius); padding: 3px; }
#zoom span { min-width: 48px; text-align: center; font-size: 12px; }
#props .head { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
#props .head canvas { width: 64px; height: 64px; image-rendering: pixelated; background: var(--panel2); border-radius: var(--radius); object-fit: contain; }
#props .head .t { font-weight: 600; }
#props .head .s { color: var(--muted); font-size: 12px; }
.field { display: grid; grid-template-columns: 96px 1fr; gap: 6px; align-items: center; margin: 5px 0; }
.field > span { color: var(--muted); font-size: 12px; }
.field .two { display: flex; gap: 4px; }
.field .two input { width: 50%; }
.btns { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
.layer { display: flex; align-items: center; gap: 6px; padding: 5px; border-radius: var(--radius); }
.layer.on { background: #2f3e57; }
.layer .nm { flex: 1; cursor: pointer; }
.layer .ct { color: var(--muted); font-size: 11px; }
.layer button { padding: 1px 5px; background: transparent; border-color: transparent; }
.qc { border-left: 3px solid var(--warn); background: var(--panel2); border-radius: var(--radius); padding: 6px 8px; margin: 6px 0; }
.qc.b { border-left-color: var(--danger); }
.qc .m { margin-bottom: 4px; }
.qc .w { color: var(--muted); font-size: 11px; }
#modal { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: grid; place-items: center; z-index: 20; }
#modal .box { width: min(680px, 94vw); max-height: 86vh; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
#modal header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); }
#modal h2 { margin: 0; font-size: 16px; }
#m-close { background: transparent; border: 0; }
#m-body { padding: 14px 16px; overflow-y: auto; }
#m-actions { display: flex; justify-content: flex-end; gap: 6px; padding: 10px 16px; border-top: 1px solid var(--line); }
#m-body p { margin: 0 0 10px; }
#m-body table { width: 100%; border-collapse: collapse; }
#m-body td, #m-body th { text-align: left; padding: 6px; border-bottom: 1px solid var(--line); font-size: 12px; vertical-align: middle; }
#m-body th { color: var(--muted); font-weight: 500; }
#m-body .field { grid-template-columns: 150px 1fr; }
#m-body ol { padding-left: 18px; color: var(--muted); }
#menu { position: fixed; top: 44px; right: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 4px; z-index: 15; display: flex; flex-direction: column; min-width: 220px; }
#menu button { text-align: left; border: 0; background: transparent; }
#menu button:hover { background: var(--panel2); }
#toasts { position: fixed; bottom: 34px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; z-index: 30; pointer-events: none; }
.toast { background: #283142; border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 14px; box-shadow: 0 6px 20px rgba(0,0,0,0.4); }
.toast.warn { border-color: var(--warn); }
.toast.err { border-color: var(--danger); }
@media (max-width: 1100px) { #app { grid-template-columns: 250px 1fr 260px; } #tools button span { display: none; } }
</style>
</head>
<body>
<div id="boot"><div class="boot-box"><div class="brand big">⚓ LStudio</div><div id="boot-msg">Chargement du monde de Marée Morte…</div><div class="bar"><i id="boot-bar"></i></div></div></div>
<div id="app" class="hidden">
  <header id="top">
    <div class="brand">⚓ LStudio</div>
    <input id="doc-name" title="Le nom de ce monde" spellcheck="false">
    <div class="group" id="tools">
      <button data-tool="select" title="Sélectionner et déplacer (V)">⬚ <span>Sélection</span></button>
      <button data-tool="place" title="Poser l'élément choisi dans la bibliothèque (P)">✚ <span>Poser</span></button>
      <button data-tool="paint" title="Peindre le sol, les régions, les collisions, la navigation (B)">🖌 <span>Peindre</span></button>
      <button data-tool="build" title="Bâtir : pièces, cloisons, sols et murs d'intérieur, décor mural, zones (K)">🏠 <span>Bâtir</span></button>
      <button data-tool="pan" title="Se déplacer sur la carte (H) — aussi : clic molette, ou Espace + glisser">✋ <span>Main</span></button>
    </div>
    <div class="group">
      <button id="b-undo" title="Annuler (Ctrl+Z)">↶</button>
      <button id="b-redo" title="Rétablir (Ctrl+Y)">↷</button>
    </div>
    <div class="grow"></div>
    <span id="save-state" class="state">—</span>
    <div class="group">
      <button id="b-save" title="Enregistrer une version (Ctrl+S)">💾 Enregistrer</button>
      <button id="b-versions" title="Les versions enregistrées, et la restauration">🕘 Versions</button>
      <button id="b-check" title="Contrôle qualité">✔ Vérifier</button>
      <button id="b-test" class="accent" title="Jouer ce monde dans le vrai jeu, en solo, dans ce navigateur">▶ Tester dans le jeu</button>
      <button id="b-publish" class="primary" title="Publier dans le jeu (pour tout le monde)">⬆ Publier</button>
      <button id="b-menu" title="Nouveau, exporter, importer, aide">☰</button>
    </div>
  </header>
  <aside id="left">
    <nav class="tabs" data-for="left"><button data-tab="lib" class="on">Bibliothèque</button><button data-tab="paint">Peinture</button><button data-tab="build">Bâtiments</button><button data-tab="map">Carte</button></nav>
    <section data-pane="lib" class="pane on">
      <input id="lib-search" placeholder="Rechercher (ex. tonneau, lanterne…)" spellcheck="false">
      <div class="row"><select id="lib-cat"></select><label class="chk"><input type="checkbox" id="lib-used"> déjà utilisés</label></div>
      <div id="lib-list" class="lib"></div>
    </section>
    <section data-pane="paint" class="pane">
      <div class="seg" id="paint-kind"><button data-k="sol" class="on">Sol</button><button data-k="regions">Régions</button><button data-k="collisions">Collisions</button><button data-k="navigation">Navigation</button></div>
      <div class="row"><span>Pinceau</span><div class="seg" id="paint-size"><button data-n="1" class="on">1</button><button data-n="2">2</button><button data-n="3">3</button><button data-n="5">5</button><button data-n="9">9</button></div></div>
      <label class="chk"><input type="checkbox" id="paint-erase"> Gomme : revenir au monde d’origine</label>
      <div id="paint-list" class="plist"></div>
      <p class="hint" id="paint-hint"></p>
    </section>
    <section data-pane="build" class="pane"><div id="build-pane"></div></section>
    <section data-pane="map" class="pane">
      <h3>Aller à</h3>
      <div class="row"><input id="go-x" type="number" placeholder="x"><input id="go-y" type="number" placeholder="y"><button id="go-btn">Aller</button></div>
      <h3>Mes repères <button id="rep-add" class="mini" title="Poser un repère au centre de la vue">+ ici</button></h3>
      <div id="rep-list" class="plist"></div>
      <h3>Régions du monde</h3>
      <div id="zone-list" class="plist"></div>
      <h3>Intérieurs</h3>
      <input id="room-search" placeholder="Filtrer les pièces" spellcheck="false">
      <div id="room-list" class="plist"></div>
    </section>
  </aside>
  <main id="stage">
    <canvas id="map" tabindex="0"></canvas>
    <canvas id="minimap" width="240" height="140" title="Cliquer pour s'y rendre"></canvas>
    <div id="status"></div>
    <div id="zoom"><button id="z-out">−</button><span id="z-val">100 %</span><button id="z-in">+</button></div>
  </main>
  <aside id="right">
    <nav class="tabs" data-for="right"><button data-tab="props" class="on">Propriétés</button><button data-tab="layers">Couches</button><button data-tab="qc">Contrôle <b id="qc-count"></b></button></nav>
    <section data-pane="props" class="pane on"><div id="props"></div></section>
    <section data-pane="layers" class="pane">
      <h3>Couches <button id="layer-add" class="mini">+ couche</button></h3>
      <div id="layer-list"></div>
      <h3>Affichage (en édition seulement)</h3>
      <div id="show-list" class="plist"></div>
    </section>
    <section data-pane="qc" class="pane">
      <button id="qc-run" class="wide">✔ Vérifier le monde</button>
      <div id="qc-list"></div>
    </section>
  </aside>
</div>
<div id="modal" class="hidden"><div class="box"><header><h2 id="m-title"></h2><button id="m-close">✕</button></header><div id="m-body"></div><footer id="m-actions"></footer></div></div>
<div id="menu" class="hidden"></div>
<div id="toasts"></div>
<input type="file" id="file-in" accept=".json,application/json" class="hidden">

",turnin:"gaspard",level:27,requires:["comte"],goals:[{type:"talk",npc:"elouan",text:"Demander au capitaine Elouan ce que dit la mer",scene:[["npc","Gaspard t'envoie ? Alors il l'a senti, lui aussi."],["me","Senti quoi ?"],["npc","La mer est pleine. Pleine \xE0 ras bord. Je pose la main sur l'eau, la nuit, et je sens des mains qui poussent de l'autre c\xF4t\xE9."],["npc","Le Kraken mort, la Couronne r\xE9gl\xE9e\u2026 et pourtant les noy\xE9s reviennent. Quelque chose les pousse vers nous. Ou quelque chose les a pouss\xE9s vers la mer, il y a longtemps."],["npc","Va voir l'\xE9pave du L\xE9viathan, \xE0 la Crique. C'est l\xE0 que tout a commenc\xE9. Tout commence toujours dans une \xE9pave."]]},{type:"explore",zone:Z.WRECK,text:"Retourner \xE0 l\u2019\xE9pave du L\xE9viathan (Crique de l\u2019\xC9pave)"}],rewards:{xp:6e3,gold:800,items:[]},offer:"La Flamme br\xFBle trop fort, petit. Depuis que la Couronne a quitt\xE9 la mer, elle rugit comme une forge. Et plus elle br\xFBle, plus la mer gronde. Va demander \xE0 Elouan ce que dit la mer, puis retourne \xE0 l'\xE9pave du L\xE9viathan.",progress:"Elouan est sur le quai de Havre-des-Brumes ; la Crique de l\u2019\xC9pave est au nord-ouest de Port-Lanterne.",done:"Le L\xE9viathan\u2026 Oui. Il est temps que je te raconte d'o\xF9 vient la Flamme.",scene:[["npc","Regarde-la, {nom}. Regarde la Flamme."],["me","Elle n'a jamais \xE9t\xE9 aussi haute."],["npc","Trop haute. Une flamme qui br\xFBle comme \xE7a, c'est une flamme qui a peur. Et depuis qu'elle rugit, la mer gronde. Les deux se r\xE9pondent."],{ask:[{q:"Vous pensez qu\u2019elles sont li\xE9es ?",a:[["npc","Je le crains depuis trente ans. Je n'ai jamais os\xE9 le dire. Ni \xE0 Morgane, ni \xE0 personne."]]},{q:"Qui pourrait savoir ?",a:[["npc","Elouan. Il \xE9coute la mer comme moi j'\xE9coute le feu. Et l'\xE9pave du L\xE9viathan : tout ce qui touche la Flamme finit par y mener."]]}],go:"J\u2019irai voir"}],sceneDone:[["npc","Tu as vu l'\xE9pave. Tu as senti la chaleur, sous l'eau froide ?"],["me","Le bois est encore ti\xE8de. Apr\xE8s tant d'ann\xE9es."],["npc","Le L\xE9viathan a br\xFBl\xE9 il y a soixante ans, devant le port. Le P\xE8re Anselme, le fondateur, a pris la derni\xE8re braise du navire en flammes, et il a allum\xE9 la Flamme B\xE9nite avec."],["npc","La Flamme et l'\xE9pave sont n\xE9es du m\xEAme feu. Je l'ai toujours su. Ce que je ne sais pas\u2026 c'est ce qu'Anselme a fait d'autre, ce jour-l\xE0. Il a \xE9crit un journal. Les pages ont \xE9t\xE9 perdues en mer."]]},a3_pages:{name:"Acte III \u2014 Le journal du P\xE8re Anselme",giver:"gaspard",turnin:"ermite",level:27,requires:["a3_flamme"],goals:[{type:"collect",item:"page_anselme",n:3,text:"Pages du journal d\u2019Anselme (les damn\xE9s les gardent, \xCEle des Damn\xE9s)"}],rewards:{xp:8e3,gold:1e3,items:[]},offer:"La mer garde ce qu'elle prend\u2026 et elle le confie \xE0 ses pires gardiens. On dit que les damn\xE9s de l'\xCEle des Damn\xE9s serrent contre eux des pages d'un vieux journal, sans savoir lire. Rapporte-en trois. Puis va voir le vieil Ermite : il \xE9tait enfant de ch\u0153ur d'Anselme, avant de devenir fou. Enfin, plus fou.",progress:"Les damn\xE9s de l\u2019\xCEle des Damn\xE9s gardent les pages ; l\u2019Ermite vit sur son \xEElot.",done:"Les pages du P\xE8re\u2026 Je reconna\xEEtrais son \xE9criture entre mille.",scene:[["npc","Le journal d'Anselme. S'il existe encore, il est entre de mauvaises mains."],["me","Lesquelles ?"],["npc","Des mains mortes deux fois. Les damn\xE9s de l'\xCEle des Damn\xE9s. Ils ramassent tout ce que la mer rejette, comme des pies."],["npc","Trois pages suffiront. Et apporte-les \xE0 l'Ermite : il a servi la messe d'Anselme, enfant. Il saura lire entre les lignes. Entre les taches de sel, surtout."]],sceneDone:[["npc","Donnez. Donnez ! \u2026Oui. Oui, c'est sa main. Il penchait les \xAB l \xBB comme des m\xE2ts dans la temp\xEAte."],["npc","\xAB Le feu chasse les morts de la ville. Mais o\xF9 vont-ils ? Je les ai vus marcher vers l'eau, des centaines, et la mer les a pris. \xBB"],["npc","\xAB Que Dieu me pardonne : pour sauver Port-Lanterne, j'ai fait de la mer un cimeti\xE8re. Et j'ai scell\xE9 ce cimeti\xE8re avec le C\u0153ur du L\xE9viathan. \xBB"],["me","Le C\u0153ur de Corail\u2026"],["npc","Le C\u0153ur tenait la mer ferm\xE9e. Barbe-Cendre l'a arrach\xE9. Et la mer a rendu ses morts. Voil\xE0 votre Mar\xE9e Morte, pirate. Mais qui a dit \xE0 Barbe-Cendre o\xF9 dormait le L\xE9viathan ? \xC7a, le journal ne le dit pas. Allez voir C\xE9leste, \xE0 Libertalia : sa ballade est plus vieille qu'elle ne le croit."]]},a3_ballade:{name:"Acte III \u2014 Le premier couplet",giver:"ermite",turnin:"celeste",level:28,requires:["a3_pages"],goals:[{type:"talk",npc:"celeste",text:"Demander \xE0 C\xE9leste le tout premier couplet de la ballade",scene:[["npc","Le premier couplet ? Personne ne me le demande jamais. Tout le monde veut le dernier, celui des h\xE9ros."],["me","On m'a dit qu'il \xE9tait plus vieux que la ballade."],["npc","C'est vrai. Ma grand-m\xE8re le chantait. \xC9coutez\u2026"],["npc","\xAB Le pr\xEAtre alluma le feu qui chasse les morts, et la mer les but jusqu'\xE0 plus soif ; puis vint le gardien qui garde la lumi\xE8re, et qui vendit la route du c\u0153ur pour une flamme qui mourait. \xBB"],["me","Le gardien qui garde la lumi\xE8re\u2026"],["npc","Un gardien de phare, oui. C'est ce que je me suis toujours dit. Je pensais que c'\xE9tait une image. Pourquoi faites-vous cette t\xEAte ?"]]}],rewards:{xp:6e3,gold:600,items:[]},offer:"C\xE9leste chante \xE0 Libertalia. Sa ballade\u2026 ce n'est pas qu'une chanson. Allez lui demander le premier couplet, celui que personne n'\xE9coute.",progress:"C\xE9leste chante \xE0 Libertalia.",done:"Si le couplet dit vrai, le gardien de la lumi\xE8re, c'est\u2026",sceneDone:[["npc","Vous connaissez ce gardien, n'est-ce pas ? Je le vois dans vos yeux."],["me","Gaspard. Le gardien du phare de Port-Lanterne. Le gardien de la Flamme."],["npc","Alors allez lui parler. Et soyez juste. Les chansons ne disent jamais pourquoi les gens font ce qu'ils font. Seulement ce qu'ils ont fait."]]},a3_aveu:{name:"Acte III \u2014 L\u2019aveu du gardien",giver:"celeste",turnin:"gaspard",level:28,requires:["a3_ballade"],goals:[{type:"talk",npc:"gaspard",text:"Demander la v\xE9rit\xE9 \xE0 Gaspard, au phare",scene:[["npc","Tu as l'air grave, petit. Tu as trouv\xE9 le journal ?"],["me","Et la ballade de C\xE9leste. \xAB Le gardien qui garde la lumi\xE8re vendit la route du c\u0153ur. \xBB"],["npc","\u2026"],["npc","Il y a trente ans, la Flamme mourait. Elle n'\xE9tait plus qu'une braise. Les morts r\xF4daient d\xE9j\xE0 dans les ruelles. J'avais lu le journal d'Anselme, avant que la mer ne l'emporte. Je savais que le C\u0153ur du L\xE9viathan \xE9tait n\xE9 du m\xEAme feu."],["npc","Un capitaine est venu me voir. Il avait des cendres dans la barbe et de l'or plein les poches. Il voulait la route du L\xE9viathan. Je la lui ai donn\xE9e. Je croyais qu'il rapporterait le C\u0153ur, et que le C\u0153ur rallumerait la Flamme."],["me","Barbe-Cendre."],["npc","Il a gard\xE9 le C\u0153ur. La mer s'est ouverte. Et la Flamme\u2026 la Flamme a repris, oui. Pour repousser une mar\xE9e que j'avais moi-m\xEAme l\xE2ch\xE9e. C'est moi, {nom}. C'est moi qui ai d\xE9clench\xE9 la Mar\xE9e Morte."],{choose:[{q:"Vous vouliez sauver la ville. Je vous pardonne.",mem:"gaspard_pardon",a:[["npc","Tu es bien la seule personne \xE0 pouvoir dire \xE7a. Merci. Je ne le m\xE9rite pas, mais merci."]]},{q:"Des centaines de morts, Gaspard. Des centaines.",mem:"gaspard_colere",a:[["npc","Je les compte chaque nuit. Chaque nuit depuis trente ans. Tu as raison. Je ne te demande rien."]]}]}]}],rewards:{xp:4e3,gold:0,items:[]},offer:"Allez au phare. Demandez-lui la v\xE9rit\xE9. Et quoi que vous d\xE9cidiez ensuite, d\xE9cidez-le vous-m\xEAme.",progress:"Gaspard est au phare de Port-Lanterne.",done:"Il reste une chose \xE0 faire. Une seule. Et elle se fait \xE0 l'\xE9pave.",sceneDone:[["npc","L'\xE2me d'Anselme n'a jamais quitt\xE9 le L\xE9viathan. Elle veille sur le feu qu'elle a allum\xE9. Depuis que le C\u0153ur est parti, elle hurle."],["npc","Tant qu'elle hurlera, la Flamme br\xFBlera trop fort et la mer grondera. Il faut l'apaiser. Elle ne se laissera pas faire : elle croit encore prot\xE9ger Port-Lanterne."],["me","Je vais \xE0 la Crique."],["npc","Prends des amis. Anselme br\xFBlait les morts. Il br\xFBlera les vivants aussi, s'il le faut."]]},a3_ame:{name:"Acte III \u2014 L\u2019\xE2me du L\xE9viathan",giver:"gaspard",turnin:"gaspard",level:28,requires:["a3_aveu"],goals:[{type:"kill",mob:"ame_anselme",n:1,text:"Apaiser l\u2019\xC2me du P\xE8re Anselme, devant l\u2019\xE9pave du L\xE9viathan"}],rewards:{xp:15e3,gold:2500,items:[]},offer:"L'\xC2me d'Anselme hante la Crique de l'\xC9pave, devant ce qu'il reste du L\xE9viathan. Approche-toi de l'\xE9pave : elle viendra \xE0 toi. Elle vient toujours \xE0 ceux qui portent l'odeur de la Flamme.",progress:"Approchez-vous de l\u2019\xE9pave du L\xE9viathan, \xE0 la Crique de l\u2019\xC9pave : l\u2019\xC2me vient \xE0 ceux qui la cherchent.",done:"Elle s'est tue. Pour la premi\xE8re fois depuis soixante ans, l'\xE9pave s'est tue.",scene:[["npc","Avant que tu partes\u2026 Si tu ne reviens pas, je n'aurai plus personne \xE0 qui raconter mes histoires."],["me","Je reviendrai."],["npc","Ils disent tous \xE7a. Mais toi, tu reviens toujours. Va."]],sceneDone:[["npc","Elle s'est tue. Tu l'entends ? La Flamme\u2026 elle tremble, maintenant. Elle attend."],["npc","Elle attend qu'on d\xE9cide de ce qu'elle sera. Et ce n'est plus \xE0 moi de d\xE9cider. Je ne m\xE9rite plus ce droit-l\xE0."],["me","Alors c'est \xE0 moi."],["npc","C'est \xE0 toi, Capitaine {nom}. Apaise-la, porte-la, ou retourne-la contre la mer. Aucun de ces chemins n'est sans prix."]]},a3_fin_apaiser:{name:"Fin \u2014 Apaiser la Flamme",giver:"gaspard",turnin:"gaspard",level:28,requires:["a3_ame"],excl:["a3_fin_gardien","a3_fin_brasier"],ach:"fin_apaiser",goals:[{type:"talk",npc:"gaspard",text:"Rallumer la Flamme avec la derni\xE8re braise d\u2019Anselme, doucement"}],rewards:{xp:2e4,gold:3e3,items:[["lanterne_apaisee",1]]},offer:"Rallumer la Flamme avec la derni\xE8re braise de l'\xE2me d'Anselme. Elle ne chassera plus les morts vers la mer : ils reposeront l\xE0 o\xF9 ils tombent. La mer se videra, lentement. Des ann\xE9es, peut-\xEAtre. Mais plus personne ne nourrira la mar\xE9e.",progress:"Parlez \xE0 Gaspard, au phare : il vous accompagnera jusqu\u2019\xE0 la Flamme.",done:"Regarde-la. Elle est\u2026 douce. Je ne l'avais jamais vue comme \xE7a.",sceneDone:[["npc","Pose la braise. L\xE0, au c\u0153ur. Doucement."],["npc","\u2026Regarde. Elle ne rugit plus. Elle respire. Les morts ne seront plus chass\xE9s : ils s'endormiront o\xF9 ils tombent, et la mer rendra ses derniers, puis plus rien."],["npc","Prends cette lanterne. La premi\xE8re lumi\xE8re de la nouvelle Flamme. Port-Lanterne ne saura jamais ce que tu as fait. Moi, je saurai."]]},a3_fin_gardien:{name:"Fin \u2014 Porter la Flamme",giver:"gaspard",turnin:"gaspard",level:28,requires:["a3_ame"],excl:["a3_fin_apaiser","a3_fin_brasier"],ach:"fin_gardien",goals:[{type:"talk",npc:"gaspard",text:"Prendre la garde de la Flamme, et son fardeau"}],rewards:{xp:2e4,gold:3e3,items:[["braise_gardien",1]]},offer:"Garder la Flamme telle qu'elle est. La ville reste s\xFBre ; la mer reste pleine, et quelqu'un doit veiller \xE0 ce qu'elle ne d\xE9borde plus jamais. Ce quelqu'un, ce serait toi. Je suis trop vieux, et je n'en suis plus digne.",progress:"Parlez \xE0 Gaspard, au phare : il vous accompagnera jusqu\u2019\xE0 la Flamme.",done:"Gardien de la Flamme. \xC7a te va bien. Mieux qu'\xE0 moi.",sceneDone:[["npc","Tends la main. Non, n'aie pas peur : elle ne br\xFBle pas ceux qui la gardent."],["npc","Voil\xE0. Tu sens ? Elle te conna\xEEt, maintenant. Chaque mort qu'elle chassera, tu le sentiras partir vers la mer. C'est le prix. C'est aussi ce qui t'emp\xEAchera d'oublier."],["npc","Prends cette braise. Elle ne s'\xE9teindra jamais, tant que tu vivras. Port-Lanterne dormira tranquille. Et toi\u2026 un peu moins."]]},a3_fin_brasier:{name:"Fin \u2014 Retourner la Flamme contre la mer",giver:"gaspard",turnin:"gaspard",level:28,requires:["a3_ame"],excl:["a3_fin_apaiser","a3_fin_gardien"],ach:"fin_brasier",goals:[{type:"talk",npc:"gaspard",text:"Jeter la Flamme dans la mer, et br\xFBler la Mar\xE9e"}],rewards:{xp:2e4,gold:3e3,items:[["tison_marees",1]]},offer:"Il existe une autre voie, que je n'ose pas nommer. Jeter la Flamme dans la mer. Le feu d'Anselme br\xFBlerait les morts jusque dans les abysses. La Mar\xE9e Morte finirait en une nuit. Mais la Flamme se consumerait avec eux, et Port-Lanterne\u2026 Port-Lanterne devrait apprendre \xE0 se d\xE9fendre seule.",progress:"Parlez \xE0 Gaspard, au phare : il vous accompagnera jusqu\u2019\xE0 la Flamme.",done:"Une nuit. Il a fallu une nuit. La mer a br\xFBl\xE9 jusqu'\xE0 l'aube.",sceneDone:[["npc","Tu l'as vue ? La mer en feu, d'un bout \xE0 l'autre de l'archipel. Les noy\xE9s qui br\xFBlaient comme des chandelles, sous l'eau."],["npc","La Mar\xE9e Morte est finie. La vraie. Mais regarde la place : il ne reste qu'une braise, l\xE0 o\xF9 br\xFBlait la Flamme. Il faudra des ann\xE9es pour qu'elle reprenne."],["npc","Prends ce tison. C'est tout ce qu'il reste du feu d'Anselme. Les morts le craignent plus que n'importe quelle lame. Ils ont raison."]]}};var Ju={premier_pas:{scene:[["npc","Encore un naufrag\xE9\u2026 Rel\xE8ve-toi, matelot. Tu es \xE0 Port-Lanterne, et tu respires encore : c'est d\xE9j\xE0 une bonne journ\xE9e."],["me","O\xF9 sont les autres ? Mon navire\u2026"],["npc","La mer garde ce qu'elle prend. Depuis la Mar\xE9e Morte, elle rend aussi. Mais pas ce qu'on voudrait."],{choose:[{q:"Mon navire a sombr\xE9. Je suis le seul \xE0 avoir nag\xE9.",mem:"origine_naufrage",a:[["npc","Alors tu as de bons bras et de la chance. Ici, il faut les deux."]]},{q:"Je fuis quelqu\u2019un. Mieux vaut ne pas dire qui.",mem:"origine_fuite",a:[["npc","Tout le monde fuit quelque chose, \xE0 Port-Lanterne. Garde ton secret ; les morts, eux, ne posent pas de questions."]]},{q:"On m\u2019a parl\xE9 d\u2019un tr\xE9sor. Je suis venu le chercher.",mem:"origine_tresor",a:[["npc","Un tr\xE9sor\u2026 Ils disent tous \xE7a. La plupart finissent dans la vase avec leur carte. Toi, essaie de faire mieux."]]}]},["npc","Tant que la Flamme B\xE9nite br\xFBle sur la place, les morts ne passent pas nos rues. Au-del\xE0, c'est leur royaume."],["npc","Va voir Isa, \xE0 la forge. Personne ne sort d'ici les mains vides : elle te trouvera de quoi te d\xE9fendre."]],sceneDone:[["npc","Morgane t'envoie ? Elle a l'\u0153il pour les t\xEAtes dures. Montre tes mains\u2026 Des mains de marin. Bien."],["me","Elle m'a dit que vous auriez une arme."],["npc","Une arme, c'est beaucoup dire. Ce pistolet crache plus de fum\xE9e que de plomb. Mais la fum\xE9e, \xE7a fait reculer les morts aussi."],["npc","Clic droit pour tirer. Vise bien, et recharge vite. Le reste, tu l'apprendras dehors."]]},pinces:{scene:[["npc","Tu sens \xE7a ? Non ? Attends que le vent tourne."],["me","Qu'est-ce que c'est ?"],["npc","Les crabes de la plage. Ils pourrissent sur pattes depuis la Mar\xE9e Morte, et ils ont pris go\xFBt aux filets. Et aux orteils des p\xEAcheurs."],{ask:[{q:"Des crabes ? Vraiment ?",a:[["npc","Ris tant que tu veux. Le vieux Mathurin en a perdu deux doigts. Il dit trois, mais il compte mal."]]},{q:"Comment les tuer ?",a:[["npc","Frappe fort, recule, recommence. Et ne te laisse pas encercler : un crabe, \xE7a va ; six, c'est une mar\xE9e."]]}],go:"J\u2019y vais"},["npc","Six, au sud-ouest de la ville. Et reviens avec tous tes orteils."]],sceneDone:[["npc","Ha ! Tu empestes le crabe pourri. C'est bon signe : \xE7a veut dire que tu as gagn\xE9."],["me","J'ai les bottes pleines de carapaces."],["npc","Tiens, un bandana. \xC7a cache l'odeur\u2026 un peu. Et \xE7a te donne l'air d'un vrai pirate. Beaucoup."]]},matelots:{scene:[["npc","Tu les as vus, sur la plage ? Les marins qui marchent sans savoir o\xF9 ils vont ?"],["me","Des morts. Il y en a partout."],["npc","Pas n'importe quels morts. Mon \xE9quipage. La Mouette \xC9carlate a sombr\xE9 il y a deux hivers. La Mar\xE9e Morte me les a rendus\u2026 comme \xE7a."],["npc","Je n'ai pas le courage de lever mon sabre sur eux. Toi, tu ne les connais pas. Lib\xE8re-les, je t'en prie. Huit d'entre eux."]],sceneDone:[["npc","C'est fait ? Ils\u2026 ils reposent ?"],["me","Ils ne marchent plus."],{choose:[{q:"Dites-moi leurs noms. Je m\u2019en souviendrai.",mem:"matelots_noms",a:[["npc","Jehan, le gabier. Pol, qui chantait faux. La petite Ma\xEBlle, notre mousse\u2026 Merci. Quelqu'un d'autre que moi s'en souviendra."]]},{q:"Je n\u2019ai pas besoin de savoir qui ils \xE9taient.",mem:"matelots_silence",a:[["npc","Tu as raison. C'est plus simple ainsi. Pour toi."]]}]},["npc","Prends cette marini\xE8re. Elle appartenait \xE0 mon second. Il aurait voulu qu'elle reprenne la mer."]]},tonnelet:{scene:[["npc","Un drame ! Une trag\xE9die ! On m'a vol\xE9 mon b\xE9b\xE9 !"],["me","Votre\u2026 b\xE9b\xE9 ?"],["npc","Mon tonnelet ! Mon meilleur rhum, vieilli douze ans dans la cale d'un galion ! Les boucaniers l'ont tra\xEEn\xE9 jusqu'aux Ruines du Temple, tout au nord de la jungle."],{ask:[{q:"Pourquoi des morts voudraient du rhum ?",a:[["npc","Parce qu'ils ont \xE9t\xE9 pirates avant d'\xEAtre morts ! On ne perd pas ses bonnes habitudes, m\xEAme sous terre."]]},{q:"Et la r\xE9compense ?",a:[["npc","En nature, mon ami. En nature. H\xE9 h\xE9."]]}],go:"Je le ram\xE8ne"}],sceneDone:[["npc","Mon b\xE9b\xE9 ! Intact ! Laisse-moi le serrer contre moi\u2026"],["npc","\u2026Attends. Il est un peu l\xE9ger, non ?"],{choose:[{q:"J\u2019y ai go\xFBt\xE9. Un peu. Pour v\xE9rifier.",mem:"rhum_goute",a:[["npc","Pour v\xE9rifier ! Ha ! Au moins tu es honn\xEAte. Et tu as bon go\xFBt."]]},{q:"Pas une goutte, jur\xE9 sur ma t\xEAte.",mem:"rhum_intact",a:[["npc","Sur ta t\xEAte. Hm. Elle sent le rhum, ta t\xEAte. Bon, je te crois. Presque."]]}]},["npc","Tiens, trois bouteilles. Et ne bois pas tout d'un coup, hein."]]},os_lanterne:{scene:[["npc","Approche, petit. Regarde la Flamme. Tu vois comme elle tremble ?"],["me","Elle a l'air fatigu\xE9e."],["npc","Elle l'est. Elle se nourrit des os maudits : les br\xFBler purifie la mal\xE9diction, et la Flamme reprend des forces. Sans elle, les morts entreraient en ville d\xE8s ce soir."],{ask:[{q:"D\u2019o\xF9 vient la Flamme B\xE9nite ?",a:[["npc","Un pr\xEAtre l'a allum\xE9e le jour de la fondation, avec la derni\xE8re braise d'un navire qui br\xFBlait. Personne ne l'a jamais laiss\xE9e s'\xE9teindre. Moi non plus."]]},{q:"O\xF9 trouver ces os ?",a:[["npc","Dans les morts, forc\xE9ment. Ils en sont pleins. Dix, et la Flamme tiendra l'hiver."]]}],go:"J\u2019en rapporterai dix"}],sceneDone:[["npc","Jette-les. L\xE0, dans le feu\u2026 Regarde !"],["me","Elle monte. Elle chante, presque."],["npc","Garde cette amulette : une braise de la Flamme y br\xFBle. Elle veillera sur toi l\xE0 o\xF9 la Flamme ne va pas."]]},marais:{scene:[["npc","Tu as nourri la Flamme. Maintenant, il faut que tu voies d'o\xF9 vient le mal."],["npc","\xC0 l'ouest, au-del\xE0 de la rivi\xE8re, s'\xE9tend le Marais des Noy\xE9s. Ceux que la mer a pris y remontent chaque nuit, la bouche pleine de vase."],["me","Et vous voulez que j'y aille. La nuit."],["npc","Le jour, si tu pr\xE9f\xE8res : ils y sont aussi, ils dorment juste moins. Renvoie-en six au fond. Et rapporte-moi tes yeux : j'ai besoin de savoir ce que tu y as vu."]],sceneDone:[["npc","Tu es revenu ! Et entier, en plus. Alors ? Raconte."],["me","De la brume, des cloches qui sonnent sous l'eau, et des noy\xE9s qui marchent vers la mer."],["npc","Vers la mer\u2026 Ils ob\xE9issent \xE0 quelqu'un. Ce tricorne \xE9tait le mien, autrefois. Il te va mieux qu'\xE0 moi, et tu en auras besoin."]]},canonniers:{scene:[["npc","Gaspard m'a parl\xE9 de tes yeux. Les noy\xE9s marchent vers la Crique de l'\xC9pave, au nord-ouest. Et ce n'est pas un hasard."],["npc","Des squelettes arm\xE9s de mousquets gardent le chemin. C'est Barbe-Cendre qui les a post\xE9s l\xE0."],["me","Barbe-Cendre ?"],["npc","Un capitaine qui a vendu son \xE9quipage \xE0 la mer pour un tr\xE9sor. Il est mort en le trouvant. Il ne l'a pas l\xE2ch\xE9 pour autant. Abats six canonniers, et garde la t\xEAte basse : ils visent bien, pour des morts."]],sceneDone:[["npc","Le chemin de la crique est ouvert. Tu as de la poudre sur les joues."],["me","Ils visaient bien, en effet."],["npc","Prends ces bottes. Sur le pont glissant de l'\xE9pave, elles valent de l'or. Tu vas en avoir besoin, tr\xE8s bient\xF4t."]]},maree_morte:{scene:[["npc","Il est temps, {nom}."],["npc","Barbe-Cendre a trouv\xE9 le C\u0153ur de Corail dans l'\xE9pave du L\xE9viathan. C'est lui qui appelle la Mar\xE9e Morte. Chaque nuit, plus fort."],["me","Et si on brise le C\u0153ur ?"],["npc","Alors la mar\xE9e redescendra. Pas pour toujours, peut-\xEAtre. Mais assez pour que Port-Lanterne respire."],{ask:[{q:"Pourquoi moi ?",a:[["npc","Parce que tu es revenu du marais, de la crique, de partout o\xF9 je t'ai envoy\xE9. Les autres ne reviennent pas."]]},{q:"Et s\u2019il me tue ?",a:[["npc","Alors tu te rel\xE8veras ici, devant la Flamme, un peu plus pauvre. Ce n'est pas lui qui choisit qui reste mort. C'est la Flamme."]]}],go:"Je l\u2019enverrai par le fond"}],sceneDone:[["npc","Tu l'as fait\u2026 Regarde la mer. Elle redescend d\xE9j\xE0."],["me","Il a cri\xE9 quelque chose en tombant. \xAB Elle reviendra. \xBB"],["npc","Peut-\xEAtre. Mais pas ce soir. Port-Lanterne te doit tout, Capitaine. Oui, Capitaine : ce titre, tu l'as m\xE9rit\xE9."]]},traversee:{scene:[["npc","Tu regardes l'horizon comme moi \xE0 ton \xE2ge. Tu veux voir du pays ?"],["me","Il y a quoi, de l'autre c\xF4t\xE9 ?"],["npc","Havre-des-Brumes, plein est. Ma cousine Ysaline y tient le chantier naval. Il te faut une barque : ach\xE8te-la-moi, mets-la \xE0 l'eau depuis le quai, face \xE0 l'eau, et file."],{ask:[{q:"C\u2019est dangereux, la mer ?",a:[["npc","Moins que la terre, ces temps-ci. \xC9vite seulement le Gouffre, au sud. Il chante, la nuit."]]},{q:"Comment on accoste ?",a:[["npc","Tu approches d'un quai ou d'une plage, tu cargues la voile, tu jettes l'ancre, et tu descends par la passerelle. Et si tu descends voiles dehors, ton navire repart sans toi."]]}],go:"En route"},["npc","Dis-lui que c'est Corentin qui t'envoie. Elle te fera un prix. Peut-\xEAtre."]],sceneDone:[["npc","Corentin t'envoie ? Et tu as travers\xE9 sans couler ? Bravo. Il dit \xE7a \xE0 tout le monde, tu sais. La moiti\xE9 coulent."],["me","J'ai eu de la chance."],["npc","La chance, en mer, c'est savoir ramer. Si un jour tu veux un vrai navire, reviens me voir. Je construis les meilleurs de l'archipel. Les seuls, aussi."]]},grotte:{scene:[["npc","Tu as vu ma salle ? Sombre comme une cale. Les chandelles, avec tout ce rhum qui coule, c'est un incendie qui attend son heure."],["npc","On raconte que des cristaux poussent au fond des grottes, et qu'ils brillent comme la Flamme B\xE9nite. Sans chaleur."],["me","Et ces grottes, o\xF9 sont-elles ?"],["npc","Bien cach\xE9es. Cherche les fissures dans la roche, les courants d'air, les endroits o\xF9 les morts ne vont pas. Trois cristaux, et ta chope est pay\xE9e pour l'ann\xE9e."]],sceneDone:[["npc","Regarde-moi \xE7a ! La salle n'a jamais \xE9t\xE9 aussi belle. Les clients restent, maintenant. Ils boivent plus."],["me","C'\xE9tait l'id\xE9e ?"],["npc","C'est toujours l'id\xE9e, ch\xE9ri. Tiens, deux \xE9lixirs : la maison offre."]]},roi_os:{scene:[["npc","Chaque nuit, des boulets tombent sur nos barques. Ils viennent de l'\xCEle au Cr\xE2ne."],["npc","Au fond de l'Antre du Cr\xE2ne r\xE8gne le Roi des Os. Ses canonniers ne dorment jamais, et lui non plus."],["me","Un roi. Il a une couronne ?"],["npc","Une couronne d'os de rois. Si tu as le cran, va la lui arracher. Prends des amis, et beaucoup de rhum : l'un des deux te servira."]],sceneDone:[["npc","Tu l'as fait ! Cette nuit, les barques pourront sortir. Les p\xEAcheurs vont te porter en triomphe, pr\xE9pare-toi."],["me","Je pr\xE9f\xE9rerais un lit."],["npc","Tu auras les deux. Ce manteau appartenait au dernier capitaine de Havre. Il est \xE0 toi, maintenant."]]},acier_duel:{scene:[["npc","Regarde ce dessin. Une rapi\xE8re de duelliste. Fine comme une aiguille, souple comme une liane."],["me","Elle est belle."],["npc","Elle n'existe pas encore. Il me manque le m\xE9tal. Quatre vieilles lames de boucanier pour la refonte, six dents de zombie pour la trempe."],{ask:[{q:"Des dents ? Pour la trempe ?",a:[["npc","Une vieille recette de mon p\xE8re. Les dents des morts sont dures comme le remords. \xC7a donne de l'\xE2me \xE0 l'acier. Ou alors c'est des b\xEAtises. Mais \xE7a marche."]]}],go:"Je rapporte tout \xE7a"}],sceneDone:[["npc","Regarde-moi ce fil ! \xC9coute-le chanter quand je le plie."],["me","Elle ne coupe pas ?"],["npc","Une rapi\xE8re, \xE7a ne tranche pas : \xE7a transperce. Vise juste, et loin devant toi. Et ne la pr\xEAte \xE0 personne."]]},duel_aube:{scene:[["npc","Mon p\xE8re \xE9tait capitaine avant moi. Il est mort dans son lit, ce qui est rare chez nous. Sa cabine est rest\xE9e telle qu'il l'a laiss\xE9e."],["npc","Les boucaniers de la jungle l'ont pill\xE9e la semaine derni\xE8re. Ils ont tout pris\u2026 sauf ce qu'ils n'ont pas trouv\xE9."],["me","Qu'est-ce qu'ils n'ont pas trouv\xE9 ?"],["npc","Son pistolet de duel. Il n'a jamais rat\xE9 un duel. Abats-en dix, venge sa cabine, et il est \xE0 toi."]],sceneDone:[["npc","Dix. Les boucaniers vont r\xE9fl\xE9chir avant de revenir. S'ils r\xE9fl\xE9chissent encore."],["npc","Tiens. Le pistolet de mon p\xE8re. Il a mis fin \xE0 plus de querelles que tous les juges de l'archipel."],["me","Je le traiterai bien."],["npc","Traite bien ceux qui sont en face. C'est ce qu'il disait. Ensuite, il tirait."]]},bois_marine:{scene:[["npc","Un chantier sans bois, c'est une taverne sans rhum. Je n'ai plus rien : les temp\xEAtes ont tout pris."],["me","Qu'est-ce qu'il vous faut ?"],["npc","Huit planches d'\xE9pave, sur les plages. Et quatre lambeaux de voile arrach\xE9s aux matelots zombies. Ne fais pas cette t\xEAte : ils n'en ont plus l'usage."],["npc","En \xE9change, le harpon de mon grand-p\xE8re. Avec \xE7a, les noy\xE9s gardent leurs distances."]],sceneDone:[["npc","C'est du bon bois. Sal\xE9, sec, il a de la m\xE9moire. Les meilleurs navires sont faits de vieux navires."],["npc","Voil\xE0 le harpon. Frappe de loin, et ne le laisse pas dans un noy\xE9 : ils ne le rendent jamais."]]},oeil_guetteur:{scene:[["npc","Monte avec moi en haut du phare, un jour. D'ici, je vois tout l'archipel. Et ce que je vois ne me pla\xEEt pas."],["npc","Sur l'\xCEle au Cr\xE2ne, les canonniers astiquent leurs mousquets. Ils pr\xE9parent quelque chose."],["me","Vous voulez que j'aille les faire taire."],["npc","Huit d'entre eux. En \xE9change, mon long fusil de guetteur : il porte plus loin que mes yeux, et mes yeux portent loin."]],sceneDone:[["npc","Je les ai entendus se taire, un par un. D'ici. Le vent porte bien les coups de feu."],["npc","Voil\xE0 mon long fusil. Prends le temps de viser : il ne pardonne pas l'impatience. Moi non plus, d'ailleurs."]]},disparus:{scene:[["npc","Trois navires cette lune. Pas d'\xE9pave, pas de survivant. Rien."],["me","La temp\xEAte ?"],["npc","Il n'y a pas eu de temp\xEAte. Il y a eu des chants, la nuit, qui montaient de l'eau. Tous pr\xE8s du Gouffre, entre Port-Lanterne et l'\xCEle au Cr\xE2ne."],["npc","Le capitaine Elouan dit savoir ce qui se passe. Il est sur le quai. Il ne parle qu'aux gens qui ont du cran : \xE7a tombe bien, non ?"]],sceneDone:[["npc","Ysaline t'envoie ? Bien. Assieds-toi. Non, pas l\xE0 : l\xE0, dos \xE0 la mer. On ne lui tourne pas le dos impun\xE9ment, mais on peut \xE9viter de la regarder."],["me","Qu'est-ce qui chante sous le Gouffre ?"],["npc","Ce que je vais te dire, personne ne veut l'entendre : il y a quelque chose sous le Gouffre. Quelque chose d'\xE9norme. Et \xE7a a faim."]]},encre_abysses:{scene:[["npc","Tu as d\xE9j\xE0 ouvert un noy\xE9 ? Moi, oui. Ils ont de l'encre dans les veines. Noire, \xE9paisse, qui sent le fond de la mer."],["me","L'encre de la b\xEAte."],["npc","Tu comprends vite. Rapporte-m'en cinq fioles, et je te taillerai la Conque des Abysses : le seul appel auquel le Kraken r\xE9pond."],{ask:[{q:"Pourquoi voudrait-on l\u2019appeler ?",a:[["npc","Parce qu'on ne tue pas ce qu'on attend. On tue ce qu'on fait venir, \xE0 l'heure qu'on choisit, avec les canons charg\xE9s."]]}],go:"J\u2019apporterai l\u2019encre"}],sceneDone:[["npc","Cinq fioles. Elles bougent encore, tu vois ? Elle sait que je la prends."],["npc","Voil\xE0 ta conque. Souffle dedans \xE0 bord, au-dessus du Gouffre, et il viendra. Je t'accompagnerai avec le Go\xE9land."],["me","Merci, capitaine."],["npc","Ne me remercie pas. Remercie-moi si on en revient."]]},kraken:{scene:[["npc","Le moment est venu. J'ai fait graisser les canons du Go\xE9land, et Morgane a promis la Mouette \xC9carlate."],["npc","Prends le meilleur navire que tu trouves, des amis, du rhum et toute ta poudre. Mets le cap sur le Gouffre, et souffle."],["me","Et si on coule ?"],["npc","Alors on coulera ensemble, et on chantera sous l'eau avec les autres. Mais je n'ai pas l'intention de chanter, {nom}. Pas aujourd'hui."]],sceneDone:[["npc","Tu l'as fait\u2026 Tu l'as vraiment fait."],["me","Le Go\xE9land\u2026"],["npc","Il g\xEEt au fond. Mais moi je suis vivant, et la mer se tait enfin. \xC9coute-la. Pour la premi\xE8re fois depuis des ann\xE9es, elle ne chante plus."],["npc","Va voir Morgane. Elle voudra entendre \xE7a de ta bouche, pas de la mienne."]]},dernier_chant:{scene:[["npc","Morgane a perdu son \xE9quipage \xE0 cause du C\u0153ur de Corail, puis du Kraken qui le gardait. Elle ne le dira jamais, mais elle n'a plus dormi depuis."],["npc","Va lui dire que le Kraken est mort. \xC7a ne les ram\xE8nera pas. Mais \xE7a l'aidera peut-\xEAtre \xE0 fermer les yeux."]],sceneDone:[["npc","Tu as une dr\xF4le de t\xEAte. Ce n'est pas une mauvaise nouvelle, j'esp\xE8re. J'en ai eu ma part."],["me","Le Kraken est mort, Morgane. Elouan et moi, on l'a renvoy\xE9 aux abysses."],["npc","\u2026Le Kraken. Tu as tu\xE9 le Kraken."],["npc","Mon \xE9quipage\u2026 Ils peuvent se reposer, maintenant. Tous."],["npc","Prends ce troph\xE9e. On en fera une l\xE9gende, et ta maison en sera le mus\xE9e. Bienvenue parmi les capitaines dont on chante le nom, {nom}."]]},rumeur_rade:{scene:[["npc","Un nom revient sur tous les quais : la Couronne des Mar\xE9es."],["me","Une couronne de plus, pour un mort de plus ?"],["npc","Pas celle-l\xE0. On dit qu'elle commande \xE0 la mer\u2026 et peut-\xEAtre \xE0 la Mar\xE9e Morte. Si elle existe, il faut qu'elle soit entre de bonnes mains. Les n\xF4tres, de pr\xE9f\xE9rence."],["npc","Un capitaine enferm\xE9 \xE0 Rade-aux-Flibustiers saurait o\xF9 elle est. Va l\xE0-bas, loin \xE0 l'est, au-del\xE0 de Havre. Demande Mama Lune, au Perroquet Pendu."]],sceneDone:[["npc","Morgane t'envoie ? Elle a toujours eu bon go\xFBt pour les ennuis. Assieds-toi, mon c\u0153ur. Tu bois quoi ? Peu importe, ce sera du rhum."],["me","On m'a parl\xE9 d'un capitaine prisonnier."],["npc","Ambroise Vif-Argent. Mon ancien capitaine. Mon ancien beaucoup de choses. Il croupit \xE0 la Ge\xF4le, et il m\xE9rite chaque jour qu'il y passe. Mais il sait des choses."]]},prisonnier:{scene:[["npc","La Ge\xF4le, c'est la b\xE2tisse de pierre, \xE0 l'est de la place. Va voir Ambroise."],["npc","Il va te raconter une histoire incroyable, te promettre la moiti\xE9 d'un tr\xE9sor et te demander de le sortir de l\xE0."],["me","Et ?"],["npc","Les deux premi\xE8res choses sont fausses. La troisi\xE8me, fais-la quand m\xEAme. On a besoin de ce qu'il sait."]],sceneDone:[["npc","Tiens, un visiteur ! Approchez, approchez. Ambroise Vif-Argent, capitaine. Oui, CE Vif-Argent."],["me","Jamais entendu parler."],["npc","\u2026C'est la Ge\xF4le, ils filtrent les nouvelles. \xC9coutez bien : je sais o\xF9 dort la Couronne des Mar\xE9es. Mais pour vous le dire, il faudrait que je sois\u2026 de l'autre c\xF4t\xE9 de ces barreaux."]]},trousseau:{scene:[["npc","Le ge\xF4lier, Grosbec, a deux passions : sa cl\xE9 et le rhum."],["npc","Il ne l\xE2chera jamais la premi\xE8re\u2026 sauf noy\xE9 dans la seconde. Six bouteilles. Trinquez avec lui, et quand il ronflera, son trousseau sera \xE0 vous."],["me","Et je bois, moi aussi ?"],["npc","Un peu. Pour la politesse. Pas trop : j'ai besoin de quelqu'un qui tienne debout pour ouvrir une porte."]],sceneDone:[["npc","Vous l'entendez ? Il ronfle comme un canon de 24 ! Et la cl\xE9\u2026 parfaite."],["me","On sort par la porte, alors ?"],["npc","Par la porte ? Quelle horreur. Ce serait vulgaire. Non, non : on va faire \xE7a avec style."]]},evasion:{scene:[["npc","Le plan est simple : vous ouvrez, je file, on se retrouve sur le quai."],["npc","S'ils demandent, vous ne m'avez jamais vu. Et s'ils insistent, dites-leur que j'\xE9tais beaucoup plus grand."],["me","Et si vous filez sans m'attendre ?"],["npc","Moi ? Je suis bless\xE9. Profond\xE9ment. \u2026Ouvrez, s'il vous pla\xEEt."]],sceneDone:[["npc","Libre comme l'air ! L'air de la Rade sent le poisson, mais c'est l'air de la libert\xE9. Merci, l'ami."],["npc","Bon, maintenant les affaires s\xE9rieuses : la carte de la Couronne a \xE9t\xE9 d\xE9chir\xE9e en trois. Et chaque morceau est gard\xE9 par quelque chose de tr\xE8s, tr\xE8s d\xE9sagr\xE9able."]]},trois_fragments:{scene:[["npc","Premier morceau : le Bourreau, qui pend les vivants dans la For\xEAt des Pendus."],["npc","Deuxi\xE8me : la Reine des Sir\xE8nes, au milieu de son lagon. Troisi\xE8me : le G\xE9n\xE9ral d'Os, au fond de sa crypte, sur l'Atoll des Ossements."],["me","Et vous, vous faites quoi ?"],["npc","Moi, je garde le quai. Quelqu'un doit bien le faire. C'est un poste tr\xE8s expos\xE9, vous savez."]],sceneDone:[["npc","Les trois morceaux ! Regardez-moi \xE7a\u2026 la carte est compl\xE8te. Magnifique."],["me","Elle m\xE8ne o\xF9 ?"],["npc","Patience, patience. Attendez-moi ici, je vais chercher de quoi f\xEAter \xE7a. Je reviens tout de suite. Promis."]]},trahison:{scene:[["npc","Il est parti. Avec la carte. \xC9videmment."],["npc","Il a toujours fait \xE7a, mon c\u0153ur : il prend ce qu'il aime et il file. Il m'a fait le coup trois fois. La quatri\xE8me, j'ai ouvert une taverne."],{choose:[{q:"Je lui ferai payer \xE7a.",mem:"vif_rancune",a:[["npc","Fais-lui payer. Mais garde-le vivant : il sait lire la carte, toi non."]]},{q:"Il avait peut-\xEAtre ses raisons.",mem:"vif_pardon",a:[["npc","Ses raisons\u2026 Tu es trop bon. C'est ce qui le perdra : il va t'aimer bien, maintenant."]]}]},["npc","La carte passe par l'\xCEle de la Quarantaine, au sud. L\xE0-bas, il y a quelqu'un que m\xEAme Ambroise ne sait pas embobiner : le Docteur Corbeau. Va voir S\u0153ur Agathe, au camp des survivants."]],sceneDone:[["npc","Un capitaine bavard, avec un chapeau \xE0 plume ? Oui, je l'ai vu. Difficile de le rater."],["me","O\xF9 est-il ?"],["npc","Le Docteur Corbeau l'a attrap\xE9 hier soir. Il est enferm\xE9 dans une cage, sur la place des ruines. Il chante pour garder le moral. Faux."]]},docteur:{scene:[["npc","Le Docteur Corbeau a \xAB soign\xE9 \xBB toute la colonie. Il dit que la mort est un rem\xE8de."],["npc","Ses bombes de peste empoisonnent l'air, ses corbeaux cr\xE8vent les yeux, et ses patients se rel\xE8vent pour le servir."],["me","Je le soignerai, moi aussi."],["npc","Avec du plomb, j'esp\xE8re. Tuez-le, et lib\xE9rez votre capitaine. M\xEAme s'il chante faux."]],sceneDone:[["npc","C'est fini. La colonie peut enfin dormir. Moi aussi, peut-\xEAtre."],["npc","Votre capitaine est au camp, derri\xE8re moi. Il pr\xE9tend qu'il s'est laiss\xE9 capturer expr\xE8s. Je vous laisse juger."],["npc","Prenez la tenue du Docteur : elle vous prot\xE9gera de bien pire que la peste."]]},galion:{scene:[["npc","Bon. Pour la carte, je peux tout expliquer : j'allais chercher du renfort."],["me","Du renfort."],["npc","\u2026Non ? D'accord. \xC9coutez : la carte m\xE8ne aux Brumes \xC9ternelles, au sud-est. Le Comte Vesp\xE8re y fait patrouiller son Galion Fant\xF4me."],["npc","Coulez-le, et la route de l'\xCEle des Damn\xE9s sera ouverte. Il vous faut un navire arm\xE9, et du courage. Moi, je fournis la carte. Et les encouragements."]],sceneDone:[["npc","Il a coul\xE9 ! Il a vraiment coul\xE9 ! Vous \xEAtes plus fou que moi, et ce n'est pas rien."],["npc","Tenez : un vrai navire, un brick de course. Je l'ai\u2026 emprunt\xE9. Pour vous. Maintenant, l'\xCEle des Damn\xE9s."]]},comte:{scene:[["npc","Vesp\xE8re dort dans sa crypte, sur l'\xCEle des Damn\xE9s, la Couronne sur la t\xEAte."],["npc","Tout ce qui vit l\xE0-bas est mort deux fois, et frappe comme un ouragan."],["me","Vous venez ?"],["npc","N'y allez pas seul. C'est la seule chose sens\xE9e que je dirai aujourd'hui. Profitez-en, \xE7a n'arrive pas souvent."]],sceneDone:[["npc","La Couronne des Mar\xE9es\u2026 vous l'avez. Vous l'avez vraiment. Elle est plus lourde qu'on ne croit, hein ?"],["me","Elle murmure."],["npc","Elles murmurent toutes. Bon. Maintenant, la question qui f\xE2che : qu'est-ce qu'on en fait ? Morgane voudra la briser. Moi\u2026 j'ai quelques id\xE9es. Choisissez bien."]]},fin_morgane:{scene:[["npc","Tu l'as. Je la sens d'ici : la mer se tord autour d'elle."],["npc","Donne-la-moi. Je la briserai sur l'enclume d'Isa, et la mer gardera enfin ses morts. Plus de Mar\xE9e Morte, un jour. Ce sera long, mais ce sera fini."],["me","Ambroise sera furieux."],["npc","Il s'en remettra. Il se remet de tout. C'est son seul vrai talent."]],sceneDone:[["npc","C'est fait. Isa a frapp\xE9 trois fois, et la Couronne a hurl\xE9 comme une temp\xEAte. Puis plus rien."],["npc","\xC9coute\u2026 la mer est plus calme, d\xE9j\xE0. Mon \xE9quipage dort pour de bon."],["npc","Prends ce m\xE9daillon : une \xE9tincelle de la Flamme. Et cet habit, digne d'un capitaine du roi. Port-Lanterne ne l'oubliera pas, {nom}. Moi non plus."]]},fin_fanfaron:{scene:[["npc","Donnez-la-moi. Je ne dis pas que j'en ferai bon usage. Je dis que j'en ferai un usage\u2026 int\xE9ressant."],["me","Et si vous la retourniez contre nous ?"],["npc","Contre vous ? Mon seul ami ? Jamais. Contre Morgane\u2026 non plus. Contre les ennuyeux, peut-\xEAtre. Et je vous donne mon sabre et mon manteau. Si, si. Un capitaine paie ses dettes. Parfois."]],sceneDone:[["npc","Ha ! La mer m'ob\xE9it ! Enfin, elle m'\xE9coute. Un peu. Elle a un sale caract\xE8re."],["npc","Tenez, mon sabre et mon manteau, comme promis. Si un jour vous voyez une mar\xE9e monter \xE0 l'envers, ce sera moi. Bon vent, l'ami !"]]},freres_cote:{scene:[["npc","Tu veux entrer chez les Fr\xE8res de la C\xF4te ? Prouve que tu sais compter sur quelqu'un."],["npc","Le Fort des Deux Cl\xE9s, sur la colline \xE0 l'est de la Rade. Deux dalles devant la porte : il faut un pirate sur chacune, en m\xEAme temps."],["npc","\xC0 l'int\xE9rieur, Fer et Rouille, les Fr\xE8res Ferrailleurs. C\xF4te \xE0 c\xF4te, leurs armures se renvoient les coups : rien ne les blesse. Chacun de vous en attire un, loin de l'autre, et on frappe."],["me","Et seul ?"],["npc","Seul ? Impossible. C'est tout l'int\xE9r\xEAt."]],sceneDone:[["npc","Vous l'avez fait. \xC0 deux, comme les anciens. Les Ferrailleurs ont rouill\xE9 pour de bon."],["npc","Bienvenue chez les Fr\xE8res de la C\xF4te. Portez cette tenue et cette bague : partout dans l'archipel, on saura qu'on peut compter sur vous."]]},chant_lagon:{scene:[["npc","Tu entends ? Non, bien s\xFBr. Le jour, elles se taisent. La nuit, les sir\xE8nes du lagon chantent, et nos p\xEAcheurs ne reviennent pas."],["me","Qu'est-ce qu'on peut faire ?"],["npc","Rapporte-moi six de leurs \xE9cailles. On en fera des amulettes qui bouchent les oreilles. Le lagon est \xE0 l'est, au-del\xE0 de la Rade. Et toi, bouche-toi les oreilles en y allant."]],sceneDone:[["npc","Six \xE9cailles. Elles chantent encore, tu entends ? Tout bas."],["npc","Plus pour longtemps. Merci, pirate. Les p\xEAcheurs dormiront mieux ce soir."]]},reine_lagon:{scene:[["npc","Les \xE9cailles ne suffisent pas. Tant que leur Reine chante, elles reviendront. Toujours."],["npc","Elle se tient sur l'\xEElot au nord du lagon. Sa voix fait tomber les marins \xE0 l'eau comme des fruits m\xFBrs."],["me","Alors je ne l'\xE9couterai pas."],["npc","Personne ne l'\xE9coute. On l'entend, c'est tout. Fais-la taire."]],sceneDone:[["npc","Le lagon s'est tu. Pour la premi\xE8re fois depuis ma naissance, la nuit est silencieuse."],["npc","Prends cette parure : je l'ai cousue avec les \xE9cailles. Elle soigne les blessures\u2026 et elle te va bien."]]},os_ermite:{scene:[["npc","Un visiteur ! Ne marchez pas sur la ligne, l\xE0. Si, celle-l\xE0. C'est ma barri\xE8re."],["me","Une barri\xE8re\u2026 en os ?"],["npc","Les morts n'aiment pas marcher sur les morts. Enfin, je crois. \xC7a fait vingt ans que je crois, et je suis toujours vivant : \xE7a doit marcher."],["npc","Rapportez-m'en huit, de l'Atoll des Ossements, au sud-ouest. Des os de l\xE9gionnaire : ce sont les plus disciplin\xE9s, ils restent bien en ligne."]],sceneDone:[["npc","Huit ! Superbe. Regardez comme ils s'alignent. Des soldats, m\xEAme morts."],["npc","Tenez, ma vieille tenue des sables. Je ne la mets plus : il n'y a plus de sable ici, il n'y a que des crabes."]]},remedes:{scene:[["npc","Vous avez vu les m\xE9decins de peste ? Leurs masques \xE0 bec ?"],["npc","Ils sont bourr\xE9s d'herbes et de plumes. C'est ce qui les prot\xE8ge du mal qu'ils r\xE9pandent. Ironique, non ?"],["me","Vous voulez leurs masques ?"],["npc","Ce qu'il y a dedans. Rapportez-moi plumes et herbes : je ferai des masques pour les derniers survivants. Ils sont onze. Ils \xE9taient deux cents."]],sceneDone:[["npc","Merci. Ces masques sauveront des vies. Onze vies, c'est peu. C'est tout ce qui reste."],["npc","Prenez de quoi vous r\xE9chauffer. La nuit est longue ici, et froide."]]},soie_pendus:{scene:[["npc","Vous avez des \xE9paules faites pour mes coupes, tr\xE8s cher. Mais pas le tissu qui va avec."],["npc","La plus belle soie de l'archipel pend aux arbres de la For\xEAt des Pendus. Avec les pendus au bout, malheureusement."],["me","Et ils se laissent faire ?"],["npc","Non. C'est pour \xE7a que je ne m'en occupe pas moi-m\xEAme. Huit coupons, et je vous coudrai une tenue qui se fond dans la brume."]],sceneDone:[["npc","Divine. Touchez-moi \xE7a : on dirait du brouillard tiss\xE9."],["npc","Tenez : la tenue des Brumes. Personne ne vous verra venir. Sauf moi, qui l'ai cousue."]]},forge_brasier:{scene:[["npc","J'ai entendu une histoire, dans la fum\xE9e de ma forge. Les golems de Cendrelune auraient un c\u0153ur de lave qui bat encore."],["me","Et vous voulez ce c\u0153ur."],["npc","Deux. Avec \xE7a, et six braises \xE9ternelles, je peux tremper un acier que rien ne perce. Je te forgerai une armure de conquistador. Une vraie, pas celles qui rouillent sous la pluie."]],sceneDone:[["npc","Regarde-moi ce m\xE9tal. Il chante sous le marteau. Tu l'entends ?"],["npc","Voil\xE0 ton armure : un plastron et un morion comme on n'en fait plus. Comme on n'en a jamais fait, d'ailleurs."]]},coeur_volcan:{scene:[["npc","Les golems ne sont que des \xE9tincelles. Leur p\xE8re dort au fond du volcan."],["npc","Le Brasier. Il mart\xE8le une forge que personne n'a b\xE2tie, et chaque coup fait trembler Cendrelune."],["me","Et si je l'\xE9teins ?"],["npc","Alors Cendrelune se taira, et moi j'aurai le meilleur feu de l'archipel : celui que tu me rapporteras sur tes v\xEAtements."]],sceneDone:[["npc","Tu as \xE9teint le Brasier ? Toi ? Seul, ou presque ?"],["npc","Par ma barbe\u2026 je n'en ai pas, mais par celle de mon p\xE8re : tu es une l\xE9gende. Les apprentis vont parler de toi pendant des g\xE9n\xE9rations."]]},marchandise:{scene:[["npc","Psst. Vous. Oui, vous, avec la t\xEAte de quelqu'un qui sait se taire."],["npc","Un client cherche un coffret \xE0 bijoux. N'importe lequel. Vous savez o\xF9 on en trouve : chez les autres."],["me","C'est du vol."],["npc","C'est du commerce, avec une \xE9tape en moins. Rapportez-m'en un, et je paie le double de ce qu'il vaut. La Capitainerie n'aime pas \xE7a, alors ne vous faites pas prendre."]],sceneDone:[["npc","Charmant. Charmant. Je n'ai rien vu, vous n'avez rien vu."],{choose:[{q:"Si vous avez d\u2019autres commandes, je suis l\xE0.",mem:"receleur_associe",a:[["npc","Voil\xE0 qui me pla\xEEt. Nous allons faire de grandes choses ensemble. Discr\xE8tement."]]},{q:"C\u2019\xE9tait la premi\xE8re et la derni\xE8re fois.",mem:"receleur_unefois",a:[["npc","Ils disent tous \xE7a. H\xE9 h\xE9. On se reverra."]]}]},["npc","Et voici votre or."]]},naufrageur:{scene:[["npc","Vous avez un navire ? Avec des canons ? Alors vous \xEAtes exactement ce que je cherche."],["npc","Les Bricks des Noy\xE9s canonnent tout ce qui flotte, au nord et \xE0 l'ouest de l'archipel. Mes clients n'osent plus prendre la mer."],["me","Combien ?"],["npc","Trois. Visez la ligne de flottaison : un brick qui prend l'eau ne tire plus."]],sceneDone:[["npc","Trois ! La mer respire. Mes clients aussi."],["npc","Tenez, une vraie tenue de corsaire. Vous la m\xE9ritez. Et vous avez l'air d'un corsaire, maintenant. Presque."]]},fregates:{scene:[["npc","Les bricks, c'\xE9tait l'\xE9chauffement. Les fr\xE9gates maudites tiennent le sud."],["npc","Elles tirent en bord\xE9e, trois boulets \xE0 la fois. Il faut virer vite, et frapper par l'arri\xE8re."],["me","Combien ?"],["npc","Encore trois. Et je vous offre une couleuvrine de ma collection. Ma pr\xE9f\xE9r\xE9e. Enfin, la deuxi\xE8me."]],sceneDone:[["npc","Vous \xEAtes la terreur des mers, maintenant. Ou des morts, plut\xF4t."],["npc","Prenez la couleuvrine. Elle \xE9tait ma pr\xE9f\xE9r\xE9e, en fait. Ne le dites \xE0 personne."]]},chasse_damnee:{scene:[["npc","L'\xCEle des Damn\xE9s. Les morts y sont morts deux fois, et ils frappent comme un m\xE2t qui tombe."],["npc","Les Fr\xE8res de la C\xF4te y vont \xE0 plusieurs, jamais seuls. Jamais."],["me","Qu'est-ce que vous voulez ?"],["npc","La preuve de dix damn\xE9s et de cinq molosses. Et que tu reviennes. Surtout que tu reviennes."]],sceneDone:[["npc","Tu en reviens vivant ? Alors tu es un vrai Fr\xE8re."],["npc","Prends cette essence. Avec, la forge fait des miracles. Isa saura quoi en faire."]]},lib_grand_feu:{scene:[["npc","Grand-Feu. Leur capitaine. Il hante la Baie, une lanterne \xE0 la main, et il attire les navires sur les r\xE9cifs."],["npc","Il a noy\xE9 mon second, il y a trente ans. Le premier d'une longue liste."],["me","Je l'\xE9teindrai."],["npc","Pour de bon. Pas comme les autres fois. Pour de bon."]],sceneDone:[["npc","Il est mort ? Vraiment mort ? \u2026Pour de bon ?"],["me","Sa lanterne s'est \xE9teinte dans l'eau."],["npc","Trente ans que j'attendais \xE7a. Prenez ce chapeau. Il \xE9tait \xE0 mon second, le premier que Grand-Feu ait noy\xE9. Il aurait aim\xE9 que ce soit vous qui le portiez."]]},lib_reine_mangrove:{scene:[["npc","Les contrebandiers avaient une protectrice. Une noy\xE9e couronn\xE9e de racines, qui boit la mar\xE9e."],["npc","On l'appelle la Reine de la Mangrove. Une seule reine suffit \xE0 cette \xEEle."],["me","Isaure sait que vous parlez comme \xE7a ?"],["npc","Isaure sait beaucoup de choses. Pas celle-l\xE0. Allez."]],sceneDone:[["npc","Une reine de moins. Ne le r\xE9p\xE9tez pas \xE0 Isaure, elle pourrait mal le prendre."],["npc","Prenez ces antidotes : vous en aurez besoin si vous retournez l\xE0-bas. Et vous y retournerez, je le sens."]]},lib_ballade:{scene:[["npc","La ballade de Libertalia n'a jamais \xE9t\xE9 finie. Le po\xE8te est mort au milieu du dernier couplet. D'une chope, dit-on."],["npc","Il para\xEEt que le dernier vrai couplet est grav\xE9 dans le temple de la Jungle \xC9carlate."],["me","Et vous voulez que j'aille le lire ?"],["npc","Le lire, le retenir, chasser les goules qui le gardent, et revenir me le chanter. Faux, s'il le faut. Je corrigerai."]],sceneDone:[["me","\xAB \u2026et la cit\xE9 qui choisit ses chefs ne craindra plus ni roi ni mort. \xBB"],["npc","\u2026Il est beau, ce couplet. Plus beau que tout ce que j'avais imagin\xE9."],["npc","Je le chanterai ce soir. Prenez ce collier : c'est le cadeau d'un capitaine qui m'aimait. Il est mort. Le collier, non."]]}},h0={morgane:[["q:a3_fin_apaiser","Les noy\xE9s ne reviennent presque plus. La mer se vide, doucement. C'est toi, n'est-ce pas ? Je le sens."],["q:a3_fin_brasier","La mer a br\xFBl\xE9 une nuit enti\xE8re. Je n'avais jamais rien vu d'aussi beau ni d'aussi terrible. Mon \xE9quipage \xE9tait dedans, je crois. Merci."],["q:fin_morgane","La mer est calme depuis que tu m'as confi\xE9 la Couronne. Je dors, maintenant. Merci, {nom}."],["q:fin_fanfaron","Tu as laiss\xE9 la Couronne \xE0 Ambroise\u2026 Je ne te juge pas. Enfin, un peu. Les mar\xE9es montent \xE0 l'envers, ces temps-ci."],["q:dernier_chant","Mon \xE9quipage dort pour de bon, gr\xE2ce \xE0 toi. Je n'oublierai pas, Capitaine."],["m:matelots_noms","Jehan, Pol, la petite Ma\xEBlle\u2026 Tu t'en souviens ? Moi, chaque soir. Merci de t'en souvenir aussi."],["q:maree_morte","Capitaine {nom}. Je ne me lasse pas de le dire."],["m:origine_naufrage","Tu as encore la t\xEAte de quelqu'un qui a nag\xE9 trop longtemps, {nom}. Repose-toi, de temps en temps."],["m:origine_fuite","Celui que tu fuyais n'est pas venu te chercher ici. Pas encore. Je garde un \u0153il sur le quai."],["m:origine_tresor","Alors, ce tr\xE9sor ? Tu le cherches toujours, ou c'est lui qui te cherche ?"]],bartholome:[["m:rhum_goute","Ah, le go\xFBteur ! Il manquait deux doigts dans mon tonnelet, mais tu as \xE9t\xE9 honn\xEAte. \xC7a se respecte. Et \xE7a se boit."],["m:rhum_intact","Pas une goutte, hein ? Menteur. Mais un menteur poli. J'aime bien les menteurs polis."]],gaspard:[["q:a3_fin_apaiser","Elle respire, ta Flamme. Chaque soir je viens la regarder, et chaque soir elle est plus douce."],["q:a3_fin_gardien","Gardien. Tu as les yeux de quelqu'un qui sent chaque mort partir vers la mer. Je connais ce regard. Repose-toi, un peu."],["q:a3_fin_brasier","Une braise, l\xE0 o\xF9 br\xFBlait la Flamme\u2026 On la rallumera. Toi et moi, on la rallumera. Et la mer est vide, enfin."],["m:gaspard_pardon","Tu m'as pardonn\xE9. Je n'arrive toujours pas \xE0 le faire moi-m\xEAme. Mais j'essaie, gr\xE2ce \xE0 toi."],["m:gaspard_colere","Tu as eu raison d'\xEAtre en col\xE8re. Je compte toujours. Chaque nuit."],["q:oeil_guetteur","Depuis le phare, je vois l'\xCEle au Cr\xE2ne. Silencieuse. C'est toi, \xE7a."],["q:os_lanterne","La Flamme br\xFBle plus haut depuis que tu l'as nourrie. Elle te reconna\xEEt, tu sais."]],isa:[["q:coeur_volcan","La l\xE9gende du Brasier ! Les apprentis ne parlent que de toi. Ils font des dessins. Ils sont moches, mais ils sont sinc\xE8res."],["q:acier_duel","Elle tient toujours son fil, ma rapi\xE8re ? Montre\u2026 Non, laisse, je te crois."]],elouan:[["q:kraken","On a coul\xE9 le Go\xE9land, toi et moi. Et on a gagn\xE9 quand m\xEAme. \xC7a valait un navire."]],ysaline:[["q:traversee","Ta barque tient toujours ? Corentin demande de tes nouvelles. Il dit que tu es son meilleur client. Tu es son seul client vivant."]],rosalie:[["q:grotte","Regarde mes cristaux, ils brillent encore. La salle est pleine tous les soirs, gr\xE2ce \xE0 toi."]],mama_lune:[["m:vif_rancune","Tu lui en veux toujours, \xE0 Ambroise ? Moi aussi. On a de la rancune pour deux, mon c\u0153ur."],["m:vif_pardon","Tu lui as pardonn\xE9. Tu es meilleur que nous deux r\xE9unis. Ce n'est pas difficile, remarque."]],vif_camp:[["q:fin_fanfaron","La mer m'\xE9coute, gr\xE2ce \xE0 vous. Hier, j'ai fait monter la mar\xE9e pour rien. Juste pour voir. C'\xE9tait magnifique."],["q:fin_morgane","Vous l'avez donn\xE9e \xE0 Morgane. Je comprends. Je boude, mais je comprends."],["m:vif_rancune","Vous me regardez encore comme \xE7a\u2026 Je vous l'ai dit : j'allais chercher du renfort !"],["m:vif_pardon","Mon ami ! Mon seul ami. Enfin, le seul qui me pardonne. Ce qui revient au m\xEAme."]],receleur:[["m:receleur_associe","Mon associ\xE9 pr\xE9f\xE9r\xE9 ! J'ai peut-\xEAtre une autre commande\u2026 Non ? Une autre fois, alors."],["m:receleur_unefois","Vous ici ? Je croyais que c'\xE9tait la derni\xE8re fois. H\xE9 h\xE9. Elles reviennent toutes, les derni\xE8res fois."]],agathe:[["q:docteur","La colonie dort enfin. Je prie pour vous chaque soir. Ne riez pas, \xE7a marche peut-\xEAtre."]],maelys:[["q:reine_lagon","Les p\xEAcheurs rentrent tous, maintenant. Chaque soir, je les compte. Il n'en manque aucun."]],kerbrat:[["q:freres_cote","Un Fr\xE8re de la C\xF4te ! Toujours bienvenu \xE0 ma table."]],maitre_fosse:[["a:champion_fosse","Le Champion ! La Fosse gronde rien qu'\xE0 te voir entrer."],["a:gladiateur","Dix vagues, et debout. Les gradins parlent encore de toi."]],gardien_geole:[["a:potence","Encore vous ? Je vous avais gard\xE9 votre paille. Elle est encore ti\xE8de."]],capitaine_brisemer:[["q:lib_grand_feu","Trente ans, et c'est vous qui l'avez \xE9teint. Je bois \xE0 votre sant\xE9 chaque soir."]],celeste:[["q:lib_ballade","Je chante votre couplet tous les soirs. Les gens pleurent. Enfin, ceux qui ont bu."]]},Ku=new Set,Xo=t=>{for(let e of t||[])if(e&&e.choose)for(let a of e.choose)a.mem&&Ku.add(a.mem),Xo(a.a);else if(e&&e.ask)for(let a of e.ask)Xo(a.a)};for(let t of Object.values(Ju))Xo(t.scene),Xo(t.sceneDone);for(let t of Object.values(d0)){Xo(t.scene),Xo(t.sceneDone);for(let e of t.goals)Xo(e.scene)}var p0={charpentiere_pl:{name:"Ondine Varangue",title:"Ma\xEEtresse charpenti\xE8re du chantier",repair:1,look:{skin:2,hair:1,hairStyle:"queue",top:"tablier",topCol:"brown",pants:"navy",boots:"brown",hat:"bandana",hatCol:"orange"},greet:["Une coque, \xE7a se soigne comme un vieux chien : un peu de brai, beaucoup de patience.","Attention aux copeaux, et \xE0 vos doigts !","La coque sur la cale ? Trois mois qu\u2019on la radoube. Elle repartira, foi d\u2019Ondine."],shop:["radeau","barque","sloop"],topics:[{q:"Que fait-on ici ?",a:"On radoube, on calfate, on remplace les bordages que les morts ont m\xE2ch\xE9s. Ramenez votre navire au quai de Port-Lanterne : je r\xE9pare les coques, et je vous l'arme \xE0 quai quand vous voulez."},{q:"Et cette coque, sur la cale ?",a:"La Fille-du-Vent. Un brick qui a rencontr\xE9 un r\xE9cif et un kraken la m\xEAme semaine. Les membrures tiennent ; il lui manque encore la moiti\xE9 de ses bordages en bas."}]},poissonniere_pl:{name:"Margot \xC9caille",title:"Poissonni\xE8re de la halle",look:{skin:1,hair:3,hairStyle:"long",top:"tablier",topCol:"white",pants:"brown",boots:"black",hat:"foulard",hatCol:"teal"},greet:["Sardines ! Sardines de la nuit, encore fr\xE9tillantes !","Il est frais mon poisson. Il a vu la lune, mais il est frais.","Ne t\xE2tez pas, vous l\u2019ab\xEEmez."],shop:["sardine","poisson_grille","brochette_crabe","canne_peche"],topics:[{q:"O\xF9 p\xEAcher ?",a:"Au bout de la jet\xE9e des p\xEAcheurs, \xE0 l'ouest du quai, l'eau est profonde et calme. Une canne, de la patience : le reste, c'est la mer qui d\xE9cide."}]},cartographe_pl:{name:"Ambroise Plume-S\xE8che",title:"Cartographe",look:{skin:0,hair:4,hairStyle:"court",beard:1,beardCol:4,top:"manteau",topCol:"purple",pants:"black",boots:"black",hat:"plume",hatCol:"purple"},greet:["Une carte est un mensonge que l\u2019on finit par croire. Les miennes mentent moins.","Ne touchez pas l\u2019encre : elle n\u2019est pas s\xE8che. Elle ne l\u2019est jamais."],shop:["longue_vue","conque_rappel","carte_dechiree"],topics:[{q:"Que voit-on des belv\xE9d\xE8res ?",a:"Du belv\xE9d\xE8re du phare, toute la rade et les navires qui arrivent du Levant. Du belv\xE9d\xE8re du Couchant, la prairie et la jungle. Une longue-vue y est fix\xE9e : servez-vous, elle ne mord pas."},{q:"Une carte du port ?",a:"Le quai de pierre au sud, la jet\xE9e des p\xEAcheurs et le chantier \xE0 l'ouest, le quai du Levant \xE0 l'est : c'est l\xE0 qu'accostent les marchands. Les \xE9choppes sont sur la Grand-Rue, la taverne au nord de la place."}]},voiliere_pl:{name:"Hortense Grand-Largue",title:"Voili\xE8re et tailleuse",look:{skin:3,hair:2,hairStyle:"queue",top:"chemise",topCol:"white",pants:"navy",boots:"brown",hat:"paille"},greet:["Une voile, une chemise : c\u2019est le m\xEAme point, en plus grand.","Les pirates d\xE9chirent tout. C\u2019est bon pour le commerce."],shop:["tenue_mousse","tenue_boucanier","bandana","chapeau_paille","tricorne"],topics:[{q:"Une tenue, \xE7a sert \xE0 quoi ?",a:"\xC0 ne pas ressembler \xE0 un noy\xE9, d\xE9j\xE0. Et une bonne tenue prot\xE8ge : regardez ses qualit\xE9s avant d'acheter. Pour les tenues de capitaine, il faudra voir les tailleurs de la Rade et de Libertalia."}]},epiciere_pl:{name:"Z\xE9lie Poivre",title:"\xC9pici\xE8re",look:{skin:2,hair:5,hairStyle:"long",top:"gilet",topCol:"orange",pants:"brown",boots:"brown",hat:"foulard",hatCol:"orange"},greet:["Biscuit de mer, galettes, fruits du jour : de quoi tenir jusqu\u2019au prochain port.","Le poivre ? Plus cher que l\u2019or. Les biscuits, eux, sont donn\xE9s. Presque."],shop:["banane","noix_coco","galette_coco","tarte_baies","biscuit_mer"],topics:[{q:"Que prendre pour un voyage ?",a:"Du biscuit de mer : il ne pourrit jamais, il casse les dents, mais il nourrit. Et des bananes pour le moral. Les blessures, elles, se soignent mieux pr\xE8s de la Flamme."}]},tonnelier_pl:{name:"Gildas Cercle-de-Fer",title:"Tonnelier",look:{skin:0,hair:0,hairStyle:"chauve",beard:2,beardCol:1,top:"tablier",topCol:"brown",pants:"black",boots:"black"},greet:["Un bon tonneau garde le rhum, l\u2019eau et les secrets.","\xC9coutez-le sonner : un tonneau qui sonne creux, c\u2019est un tonneau vide. Ou un tonneau vol\xE9."],shop:["tonneau_deco","caisse_deco","grog","rhum"],topics:[{q:"Pour qui travaillez-vous ?",a:"Pour Bartholom\xE9, pour la Douane, pour tous les capitaines qui ont soif. Les tonneaux de d\xE9coration ? Pour votre maison du quartier des Corsaires : c'est plus joli qu'un mur nu."}]},cordier_pl:{name:"Mathurin Chanvre",title:"Ma\xEEtre cordier",look:{skin:1,hair:4,hairStyle:"hirsute",beard:2,beardCol:4,top:"chemise",topCol:"brown",pants:"brown",boots:"brown",hat:"bonnet",hatCol:"brown"},greet:["Trois cents brasses de chanvre, tress\xE9es \xE0 la main. Sentez-moi \xE7a.","Un n\u0153ud mal fait, et c\u2019est le m\xE2t qui part. Ou le pendu qui reste."],topics:[{q:"Quel n\u0153ud apprendre d\u2019abord ?",a:"La chaise. Elle tient, elle se d\xE9fait, elle sauve un homme \xE0 la mer. Le n\u0153ud de cabestan ensuite. Le reste, c'est de la coquetterie de gabier."},{q:"Pourquoi une corderie si longue ?",a:"Parce qu'on y tresse en marchant \xE0 reculons, sur toute la longueur du cordage. La mienne fait toute la ruelle : je marche jusqu'au phare, et je reviens."}]},maitre_port:{name:"Hilaire Brisant",title:"Capitaine du port de Port-Lanterne",look:{skin:1,hair:4,hairStyle:"court",beard:1,beardCol:4,top:"capitaine",topCol:"navy",pants:"white",boots:"black",hat:"tricorne",hatCol:"navy"},greet:["Bienvenue au port. Amarrez proprement, et gardez vos canons au repos.","Les marchands du Levant accostent ici, au quai de l\u2019est. Quand ils sont l\xE0, on cherche des bras.","Le registre du port ? Il dit qui arrive, qui part, et qui ne revient pas."],topics:[{q:"Que se passe-t-il au port ?",a:"De tout, et pas tous les jours : un marchand du Levant qui accoste et qu'il faut d\xE9charger \u2014 je paie les porteurs \u2014, un colporteur sur la place, un crieur qui annonce une exp\xE9dition, un \xE9quipage qui embarque, et parfois un voleur que le guet poursuit. Ouvrez l'\u0153il."},{q:"Comment aider au d\xE9chargement ?",a:"Quand un navire marchand est \xE0 quai, prenez une caisse sur la pile du quai du Levant (E), et portez-la au d\xE9p\xF4t, devant la Douane. Trois caisses par navire et par porteur : je ne paie pas les gens qui dorment sur la pile."},{q:"O\xF9 armer mon navire ?",a:"\xC0 la bitte d'amarrage du quai, ou aupr\xE8s d'Ondine, au chantier naval, \xE0 l'ouest. Elle r\xE9pare aussi les coques."}]},conteur_pl:{name:"Le vieil Achille",title:"Conteur de la cour",look:{skin:3,hair:4,hairStyle:"long",beard:2,beardCol:4,top:"manteau",topCol:"brown",pants:"black",boots:"brown",hat:"bonnet",hatCol:"red"},greet:["Approche, approche. Le feu est chaud, et les histoires sont gratuites.","Celle-l\xE0, je ne l\u2019ai jamais racont\xE9e. Enfin, jamais deux fois de la m\xEAme fa\xE7on."],topics:[{q:"L\u2019histoire de la Flamme",a:"Quand Port-Lanterne n'\xE9tait qu'un ponton et trois cabanes, une veuve a allum\xE9 un feu sur la gr\xE8ve pour que son homme retrouve la c\xF4te. Il n'est jamais revenu. Mais le feu, lui, n'a jamais voulu s'\xE9teindre : on a b\xE2ti la ville autour."},{q:"L\u2019histoire du phare",a:"Le Vieux Gaspard dit qu'il l'a vu construire. Gaspard dit beaucoup de choses. Ce qui est s\xFBr, c'est que son faisceau chasse les ombres : les noy\xE9s d\xE9testent la lumi\xE8re qui tourne."},{q:"L\u2019histoire de la Sir\xE8ne Borgne",a:"Elle chantait faux, elle avait un \u0153il de verre, et elle a \xE9pous\xE9 Bartholom\xE9. Les marins disent qu'on l'entend encore, les nuits de pleine lune, quand le rhum est trop vieux. Moi, je dis que c'est Bartholom\xE9 qui chante."}]},crieur_pl:{name:"Barnab\xE9 la Trompe",title:"Crieur du port",ev:"annonce",look:{skin:0,hair:1,hairStyle:"court",top:"manteau",topCol:"red",pants:"black",boots:"black",hat:"tricorne",hatCol:"red"},greet:["OYEZ, OYEZ ! Une exp\xE9dition se pr\xE9pare !","OYEZ ! \xC9coutez bien, je ne le dirai que trois fois ! Enfin, tant qu\u2019on m\u2019\xE9coute."],topics:[]},colporteur_pl:{name:"Ulysse Mille-Poches",title:"Colporteur de passage",ev:"colporteur",look:{skin:2,hair:6,hairStyle:"hirsute",beard:1,top:"gilet",topCol:"green",pants:"brown",boots:"brown",hat:"plume",hatCol:"green"},greet:["Des babioles de sept mers ! Tout est vrai, rien n\u2019est cher, je repars ce soir.","Un perroquet qui jure ? Un collier qui porte chance ? Approchez !"],shop:["collier_coquillages","chaton","perroquet_vert","fumigene","des_pipes","carte_dechiree"],topics:[{q:"D\u2019o\xF9 venez-vous ?",a:"De partout, et je n'y retourne jamais. Je fais le tour de la place, je vends ce que j'ai, et le vent d\xE9cide du reste."}]},negociante_pl:{name:"Dame C\xE9leste Loinvent",title:"N\xE9gociante du Levant",ev:"navire",look:{skin:1,hair:2,hairStyle:"long",top:"manteau",topCol:"teal",pants:"white",boots:"black",hat:"plume",hatCol:"teal"},greet:["Mon navire repart \xE0 la prochaine mar\xE9e. Profitez-en.","Rhum de quinze ans, soupe de tortue des \xEEles du Levant : ce qui se fait de mieux, et rien de moins."],shop:["rhum_vieux","soupe_tortue","longue_vue","collier_coquillages"],topics:[{q:"Que transportez-vous ?",a:"Du rhum, des \xE9pices, des \xE9toffes, et des nouvelles. Les caisses vont \xE0 la Douane : si vous avez des bras, le capitaine du port paie les porteurs."}]}};var _t={silas:{name:"Silas Virevent",title:"Ancien contrebandier",look:{skin:1,hair:0,hairStyle:"queue",beard:0,top:"gilet",topCol:"purple",pants:"black",boots:"black",hat:"plume",hatCol:"purple"},greet:["Assieds-toi. Les meilleures affaires se concluent assis.","Pile, je gagne. Face, tu perds. C\u2019est pourtant une pi\xE8ce honn\xEAte.","Ne regarde pas la porte comme \xE7a : personne n\u2019entre ici sans que je le sache."],topics:[{q:"Tu connais tout le monde ?",a:"Bartholom\xE9 me doit trois tonneaux, Rosalie un secret, et la capitaine Morgane\u2026 une explication. Disons que je connais les gens qu'il faut."},{q:"Et cette pi\xE8ce ?",a:"Un doublon de Valdorne. Le seul qu'il ait jamais perdu. Il ne le sait pas encore."}]},morgane:{name:"Capitaine Morgane",title:"Capitaine de La Mouette \xC9carlate",look:{skin:0,hair:2,hairStyle:"long",top:"manteau",topCol:"red",pants:"black",boots:"black
