om\xE9",title:"Tavernier de La Sir\xE8ne Borgne",look:{skin:0,hair:1,hairStyle:"chauve",beard:2,top:"tablier",topCol:"white",pants:"brown",boots:"brown"},greet:["Bienvenue \xE0 La Sir\xE8ne Borgne ! On y boit, on y chante, on y oublie.","Un p'tit verre pour la route, matelot ?","Le rhum gu\xE9rit tout. Sauf la mort. Enfin... \xE7a d\xE9pend."],shop:["banane","noix_coco","baies","poisson_grille","brochette_crabe","galette_coco","tarte_baies","grog","rhum","canne_peche"],topics:[{q:"Des rumeurs ?",a:"On raconte que des coffres au tr\xE9sor dorment un peu partout sur l'\xEEle : sur la plage ouest, pr\xE8s des ruines, sur un \xEElot du marais... Les morts ne s'int\xE9ressent pas \xE0 l'or. Toi, si."},{q:"Pourquoi \xAB Sir\xE8ne Borgne \xBB ?",a:"Parce qu'elle a un \u0153il de verre et qu'elle chante faux. Ma d\xE9funte femme. Paix \xE0 son \xE2me. Et qu'elle y reste, surtout."}]},gaspard:{name:"Vieux Gaspard",title:"Gardien du phare",look:{skin:0,hair:4,hairStyle:"court",beard:2,top:"vareuse",topCol:"navy",pants:"navy",boots:"black",hat:"bonnet",hatCol:"navy"},greet:["Ah, la jeunesse... Toujours press\xE9e de mourir.","Mon phare veille. Et moi aussi, \xE0 peu pr\xE8s.","\xC9coute le vent, petit. Il sent la mort ce soir."],topics:[{q:"Parlez-moi de la Flamme B\xE9nite.",a:"Elle br\xFBle sur la place depuis la fondation du port. Tant qu'elle brille, aucun mort n'ose entrer en ville. C'est pour \xE7a que tu es en s\xE9curit\xE9 ici, et que tu y gu\xE9ris plus vite."},{q:"Et ce phare ?",a:"Il guide les vivants. La nuit, regarde bien son faisceau : il balaie la mer et chasse les ombres."}]},leon:{name:"L\xE9on le mousse",title:"Mousse d\xE9brouillard",look:{skin:1,hair:3,hairStyle:"court",top:"rayee",pants:"navy",boots:"brown",hat:"paille"},greet:["Salut ! T'es nouveau, toi. Moi c'est L\xE9on. J'sais plein de trucs !","Tu veux un conseil ? Demande-moi !"],topics:[{q:"Comment on se bat ?",a:"Clic gauche pour le sabre, clic droit pour tirer quand t'as un pistolet. Espace pour faire une roulade et esquiver ! Les touches 2 \xE0 5 lancent tes comp\xE9tences quand tu les as apprises."},{q:"Et si je suis bless\xE9 ?",a:"Appuie sur F pour manger ce que t'as dans ton sac. En ville, pr\xE8s de la Flamme, tu r\xE9cup\xE8res bien plus vite. Bartholom\xE9 vend de quoi manger."},{q:"O\xF9 aller ?",a:"La plage au sud-ouest pour commencer : les crabes, c'est facile. Ouvre ta carte avec M, et ton journal de qu\xEAtes avec J. L'inventaire, c'est I."},{q:"Et la nuit ?",a:"La nuit, les morts sont plus forts. Reste pr\xE8s des torches si t'as peur. Moi j'ai jamais peur. Presque."}]},primes:{name:"Tableau des primes",title:"Capitainerie de Port-Lanterne",board:1,greet:["Des avis de prime sont clou\xE9s sur le bois. Certains sont encore humides.","AVIS : la Capitainerie paie comptant pour chaque mort renvoy\xE9 au repos."],topics:[]},coco:{name:"Coco",title:"Perroquet de la taverne",parrot:1,greet:["Coco veut du rhum ! Crrr\xE2 !","Doublons ! Doublons !","Les morts marchent ! Les morts marchent !","Barbe-Cendre ! Barbe-Cendre ! Crrr...","Qui c'est le plus beau ? C'est Coco !","Lave le pont ! Lave le pont !"],topics:[]}};Object.assign(wt,{corentin:{name:"Corentin",title:"Passeur du port",look:{skin:1,hair:1,hairStyle:"court",beard:1,top:"vareuse",topCol:"teal",pants:"navy",boots:"black",hat:"bonnet",hatCol:"red"},greet:["La mer, \xE7a se m\xE9rite. Et \xE7a se rame.","Une barque, matelot ? Elle ne coule presque plus.","Le vent tourne \xE0 l'est. Bon signe pour Havre-des-Brumes."],shop:["barque","canne_peche","bandage","cloche_plongee"],topics:[{q:"Comment naviguer ?",a:"Ach\xE8te-moi une barque, puis arme-la \xE0 la bitte d'amarrage, au bout du quai : elle t'attendra amarr\xE9e, ancre au fond. Monte par la passerelle. Au cabestan, l\xE8ve l'ancre (Z, et tiens bon). Au m\xE2t, d\xE9ploie la voile (Z). \xC0 la barre, tourne la roue avec Q et D \u2014 elle reste o\xF9 tu la laisses, et il faut de l'erre pour gouverner. Vent arri\xE8re, tu files ; face au vent, tu peines. Pour descendre, jette l'ancre pr\xE8s d'un quai ou d'une plage et passe par la passerelle."},{q:"O\xF9 aller ?",a:"Plein est, Havre-des-Brumes : un village de p\xEAcheurs, \xE0 l'abri des morts. Au sud-est, l'\xCEle au Cr\xE2ne : n'y va pas sans un bon sabre. Et quelques \xEElots perdus, ici et l\xE0, que personne n'a fouill\xE9s depuis longtemps."},{q:"Et les autres pirates ?",a:"Hors des villes, personne ne te prot\xE8ge : ni des morts, ni des vivants. Un pirate peut en attaquer un autre partout, sauf \xE0 Port-Lanterne, \xE0 Havre-des-Brumes et dans les maisons. Celui qui tombe perd une part de son or."}]},rosalie:{name:"Rosalie",title:"Serveuse de La Sir\xE8ne Borgne",look:{skin:2,hair:3,hairStyle:"long",top:"tablier",topCol:"white",pants:"brown",boots:"brown",hat:"bandana",hatCol:"purple"},greet:["Installe-toi, matelot. Les chaises ne mordent pas.","Tu as l'air d'avoir vu un fant\xF4me. Ici, on en voit tous les soirs.","Une histoire contre un verre ? March\xE9 conclu."],topics:[{q:"Des histoires de grottes ?",a:"Les contrebandiers cachaient leur rhum sous la falaise, au nord de la jungle, derri\xE8re un rideau de lianes. Il y a aussi l'Antre du Cr\xE2ne, sur l'\xEEle du m\xEAme nom, et une grotte de cristal sous un \xEElot du sud. Il faut passer tout pr\xE8s pour voir les entr\xE9es."},{q:"Et Bartholom\xE9 ?",a:"Il fait semblant de grogner, mais il a un c\u0153ur d'or. Et un tonneau de rhum \xE0 la place du foie."}]},ysolde:{name:"Ysolde",title:"Aubergiste du Kraken Ivre",look:{skin:0,hair:4,hairStyle:"queue",top:"tablier",topCol:"green",pants:"black",boots:"black"},greet:["Bienvenue au Kraken Ivre ! Ici, m\xEAme les morts payent leur tourn\xE9e.","Tu viens de Port-Lanterne ? \xC0 la rame ? Respect.","Assieds-toi pr\xE8s du feu, la brume ne passe pas la porte."],shop:["poisson_grille","galette_coco","ragout_marin","soupe_champignons","grog","rhum","bandage","elixir_flamme"],topics:[{q:"Havre-des-Brumes ?",a:"Un village de p\xEAcheurs. La brume nous cache des morts, et les morts nous laissent tranquilles. La plupart du temps. Ici, pas de bagarre : on est en zone s\xFBre, comme \xE0 Port-Lanterne."},{q:"L'\xCEle au Cr\xE2ne ?",a:"Au sud, un rocher en forme de cr\xE2ne. Dans sa bouche, une grotte. Au fond de la grotte, le Roi des Os. Ceux qui y sont all\xE9s en sont revenus... rarement."}]},ysaline:{name:"Ysaline",title:"Charpenti\xE8re de marine",repair:1,look:{skin:1,hair:0,hairStyle:"queue",top:"gilet",topCol:"brown",pants:"navy",boots:"brown",hat:"bandana",hatCol:"teal"},greet:["Une coque, c'est comme un c\u0153ur : il faut l'\xE9couter.","Attention aux copeaux !","Le sloop l\xE0-bas ? Le plus rapide de l\u2019archipel. Et il a du r\xE9pondant."],shop:["cloche_plongee","scaphandre","barque","sloop","fusil_harpon","pistolet_double","harpon","cimeterre","rapiere","dague_cristal","flamberge","poivriere","pistolet_duel","pistolet_cristal","amulette_lanterne","pendentif_cristal"],topics:[{q:"Barque ou sloop ?",a:"La barque, c'est pour se promener. Le sloop file bien plus vite et porte un canon : clic droit pour tirer, sur les morts comme sur les pirates trop curieux."}]}});Object.assign(wt,{anselme:{name:"Ma\xEEtre Anselme",title:"Notaire et \xE9b\xE9niste",look:{skin:0,hair:4,hairStyle:"court",beard:1,top:"manteau",topCol:"brown",pants:"black",boots:"black",hat:"tricorne",hatCol:"black"},greet:["Une maison, un nom sur la porte, et un endroit o\xF9 mourir au chaud. Que demander de plus ?","Les six maisons du quartier des Corsaires sont \xE0 vendre. Enfin, celles qui restent."],shop:["table_bois","chaise_bois","etagere_bois","armoire","cheminee_pierre","plante_pot","tableau_mer","tapis_brode","bibliotheque","serrure_renforcee","coffre_base","lit","tapis","sol_planches","torche_base","lanterne_base","jardiniere","tonneau_deco","caisse_deco"],topics:[{q:"Comment acheter une maison ?",a:"Approchez-vous de la porte d'une maison \xE0 vendre et appuyez sur E : 800 doublons et elle est \xE0 vous, avec votre nom sur la plaque. Une seule par pirate. Dedans, tout est vide : meublez-la avec la touche B."},{q:"Et les voleurs ?",a:"Il y en a. Une porte se crochette, avec des crochets et des doigts agiles. Une serrure renforc\xE9e et un chien de garde les d\xE9couragent. Rangez vos tr\xE9sors dans vos coffres : un voleur n'emporte qu'une poign\xE9e de choses."}]},fouine:{name:"La Fouine",title:"Receleuse",look:{skin:1,hair:0,hairStyle:"long",top:"gilet",topCol:"black",pants:"black",boots:"black",hat:"bandana",hatCol:"black"},greet:["Tu ne m\u2019as jamais vue. Moi non plus.","Des crochets ? Des bijoux \xE0 revendre ? Parle bas."],shop:["crochets","carte_dechiree","bandage"],topics:[{q:"Comment on croch\xE8te ?",a:"Devant la porte d'une maison qui n'est pas la tienne, E. Une goupille apr\xE8s l'autre : appuie sur E quand l'aiguille passe dans le vert. Rate et ton crochet casse. R\xE9ussis et tu as quarante secondes pour fouiller un coffre."},{q:"\xC7a rapporte ?",a:"Une poign\xE9e d'objets du propri\xE9taire... et parfois mieux : des montres, des bagues, des perles noires qu'on ne trouve nulle part ailleurs. Mais attention : tout le monde saura que tu es un voleur."}]},lison:{name:"Lison",title:"Animali\xE8re",look:{skin:2,hair:2,hairStyle:"queue",top:"tablier",topCol:"green",pants:"brown",boots:"brown",hat:"paille"},greet:["Mes petits cherchent une famille. Et une maison, de pr\xE9f\xE9rence.","Le singe ? Il mord. Mais seulement les gens qu\u2019il aime."],shop:["chaton","chien","perroquet_vert","singe"],topics:[{q:"Un animal de compagnie ?",a:"Installez-le chez vous avec la touche B : il vivra dans votre maison. Ou faites un clic droit dessus dans votre sac : il vous suivra partout. Le chien de garde rend votre porte plus difficile \xE0 crocheter."}]},elouan:{name:"Capitaine Elouan",title:"Capitaine du Go\xE9land",look:{skin:1,hair:1,hairStyle:"long",beard:1,top:"capitaine",topCol:"navy",pants:"navy",boots:"black",hat:"tricorne",hatCol:"navy"},greet:["La mer chante, ces temps-ci. Une chanson que je n\u2019aime pas.","Le Go\xE9land est pr\xEAt. Moi, presque."],shop:["conque_abysses","sloop","tentacule_fumee"],topics:[{q:"Le Kraken ?",a:"Il dort dans le Gouffre, entre Port-Lanterne et l'\xCEle au Cr\xE2ne. Le C\u0153ur de Corail l'a r\xE9veill\xE9. Il ne vient que si on l'appelle, avec la Conque des Abysses, \xE0 bord, dans le Gouffre. Venez \xE0 plusieurs, avec des canons."},{q:"Comment le combattre ?",a:"Restez en mouvement. Quand l'eau rougit sous vous, virez de bord : une tentacule va frapper. Si une tentacule vous saisit, tirez-lui dessus. L'encre aveugle et ralentit ; le tourbillon vous aspire vers sa gueule. Et quand il plonge... priez."}]}});var Fn={skin:1,hair:0,hairStyle:"long",beard:1,top:"manteau",topCol:"purple",pants:"black",boots:"black",hat:"plume",hatCol:"purple"},Vn=[{q:"Qui \xEAtes-vous ?",a:"Ambroise Vif-Argent. Capitaine. Le meilleur de ces eaux, de l'avis de tous ceux qui ont eu la chance de me rencontrer. Les autres ne comptent pas, ils sont jaloux."},{q:"La Couronne des Mar\xE9es ?",a:"Une couronne d'or et de nacre qui commande aux mar\xE9es. Le Comte Vesp\xE8re l'a vol\xE9e il y a cent ans, et depuis, la mer recrache ses morts. Celui qui la reprend... eh bien, il fait ce qu'il veut. Moi, par exemple."}];Object.assign(wt,{mama_lune:{name:"Mama Lune",title:"Tenanci\xE8re du Perroquet Pendu",look:{skin:3,hair:4,hairStyle:"long",top:"vareuse",topCol:"purple",pants:"black",boots:"black",hat:"foulard",hatCol:"orange"},greet:["Assieds-toi, mon c\u0153ur. La Rade ne pose pas de questions, mais elle \xE9coute.","Le rhum d\u2019ici br\xFBle la gorge et les remords.","Tu as la t\xEAte de quelqu\u2019un qui cherche un capitaine. Ou des ennuis."],shop:["rhum","grog","poisson_grille","tentacule_fumee"],topics:[{q:"La Rade ?",a:"Rade-aux-Flibustiers. Pas de roi, pas de loi, juste un pacte : on ne se tue pas dans les rues. Au-del\xE0 des palissades, sur les collines, les flibustiers maudits ne respectent plus rien."},{q:"Vif-Argent ?",a:"J'ai \xE9t\xE9 son second, autrefois. Il a le c\u0153ur gros comme un boulet de canon, et il le perd aussi vite. Ne lui pr\xEAte jamais d'argent. Ni de navire. Ni ton dos."}]},vif_argent:{name:"Ambroise Vif-Argent",title:"Prisonnier, momentan\xE9ment",look:Fn,vis:{q:"evasion",s:["locked","available"]},greet:["Ah ! Enfin une t\xEAte qui ne sent pas la vase. Approchez, approchez.","Ces barreaux ? Une simple formalit\xE9.","Le ge\xF4lier a un faible pour le rhum. Moi aussi, mais \xE7a, c\u2019est une autre histoire."],topics:Vn},vif_quai:{name:"Ambroise Vif-Argent",title:"Capitaine sans navire (pour l\u2019instant)",look:Fn,vis:{q:"evasion",s:["active","ready","done"],not:{q:"trois_fragments",s:["done"]}},greet:["L\u2019air libre ! Rien de tel. Sauf peut-\xEAtre un navire. Et de l\u2019or. Et un navire en or.","Ne restez pas plant\xE9 l\xE0, on a une Couronne \xE0 voler. \xC0 reprendre, pardon."],topics:Vn},vif_camp:{name:"Ambroise Vif-Argent",title:"Rescap\xE9, et fier de l\u2019\xEAtre",look:Fn,vis:{q:"docteur",s:["done"]},greet:["Vous revoil\xE0 ! Je savais que vous viendriez. Enfin, je l\u2019esp\xE9rais. Tr\xE8s fort.","Pour la carte, je peux tout expliquer. Plus tard."],topics:Vn},geolier:{name:"Grosbec",title:"Ge\xF4lier de la Rade",look:{skin:0,hair:1,hairStyle:"chauve",beard:2,top:"gilet",topCol:"black",pants:"brown",boots:"black"},greet:["Hic. On ne touche pas aux barreaux.","Le prisonnier ? Il parle, il parle... Hic.","Personne ne sort d\u2019ici. Sauf avec la cl\xE9. Que j\u2019ai. Quelque part."],topics:[{q:"Une bouteille ?",a:"Une bouteille ? Hic. Six, oui. Six, \xE7a c'est une conversation."}]},gardien_geole:{name:"Ma\xEEtre Verrou",title:"Gardien de la Ge\xF4le",bail:1,look:{skin:1,hair:0,hairStyle:"court",beard:1,top:"capitaine",topCol:"navy",pants:"black",boots:"black",hat:"tricorne",hatCol:"black"},greet:["Encore un forban. La paille est fra\xEEche, le temps passe plus vite assis.","On sort d\u2019ici de deux fa\xE7ons : en purgeant sa peine, ou en payant la caution.","La Capitainerie tient ses comptes. Et moi, je tiens les cl\xE9s."],topics:[{q:"Pourquoi suis-je ici ?",a:"Vous \xE9tiez recherch\xE9. Trop de pirates envoy\xE9s par le fond sans qu'ils aient lev\xE9 la main sur vous, ou une maison crochet\xE9e. La garde vous a pris en ville, ou l'on vous a ramen\xE9 mort. Ici, on purge, puis l'ardoise est effac\xE9e."},{q:"Comment ne plus revenir ?",a:"Ne frappez que ceux qui vous cherchent. Celui qui se d\xE9fend n'a rien \xE0 craindre de la Capitainerie. Et l'infamie s'oublie : \xE0 force de bonne conduite, elle redescend toute seule."},{q:"Et les chasseurs de primes ?",a:"Une prime court sur chaque forban recherch\xE9 : celui qui l'abat touche une part de son or, et l'honneur qui va avec. Le classement de l'honneur est affich\xE9 \xE0 la Capitainerie\u2026 enfin, dans votre livre de compagnons (P)."}]},madame_soie:{name:"Madame Soie",title:"Couturi\xE8re des forbans",look:{skin:2,hair:0,hairStyle:"queue",top:"capitaine",topCol:"teal",pants:"black",boots:"black",hat:"plume",hatCol:"teal"},greet:["On ne vient pas \xE0 la Rade pour \xEAtre discret, mon chou. On vient pour \xEAtre vu.","Une tenue, \xE7a se m\xE9rite. Ou \xE7a s\u2019ach\xE8te.","Ce manteau ? Pris sur un amiral. Il n\u2019en avait plus besoin."],shop:["tenue_mousse","tenue_boucanier","tenue_corsaire","tenue_sables","tenue_brumes","tenue_sirene","tenue_peste"],topics:[{q:"Les tenues ?",a:"Une tenue se porte par-dessus tout le reste : elle change votre allure et vous donne ses propres bonus. Je vends les classiques. Les grandes tenues, il faut les coudre ici, \xE0 ma table de couture, ou les arracher \xE0 ceux qui les portent."}]},receleur:{name:"Le Receleur",title:"Ach\xE8te tout, ne demande rien",look:{skin:2,hair:0,hairStyle:"court",beard:1,top:"manteau",topCol:"black",pants:"black",boots:"black",hat:"tricorne",hatCol:"black",eye:"patch"},greet:["Je n\u2019ai rien vu. Vous non plus.","Un coffret \xE0 bijoux ? Je ne demande pas d\u2019o\xF9 il vient.","Les meilleures affaires se font la nuit."],shop:["crochets","serrure_renforcee","carte_dechiree","lame_corail","boussole_maudite","billet_port"]},passeur:{name:"Joseph",title:"Passeur",look:{skin:1,hair:3,hairStyle:"court",beard:1,top:"vareuse",topCol:"navy",pants:"brown",boots:"brown",hat:"bonnet",hatCol:"navy"},greet:["Une travers\xE9e ? Le billet, et je m\u2019occupe du reste.","Mon bateau n\u2019a jamais coul\xE9. Pas encore."],shop:["billet_havre","billet_rade","billet_anse"],topics:[{q:"Comment voyager ?",a:"Achetez un billet, puis utilisez-le depuis n'importe quelle ville (clic droit dans le sac) : je vous d\xE9pose sur le quai. Pour le reste du monde, il vous faudra votre propre navire."}]},passeur_havre:{name:"Gwenola",title:"Passeuse",look:{skin:0,hair:2,hairStyle:"queue",top:"vareuse",topCol:"teal",pants:"brown",boots:"brown",hat:"bonnet",hatCol:"teal"},greet:["On l\xE8ve l\u2019ancre quand vous voulez."],shop:["billet_port","billet_rade","billet_anse"]},passeur_rade:{name:"Baltazar",title:"Charpentier et passeur de la Rade",look:{skin:3,hair:0,hairStyle:"chauve",beard:2,top:"tablier",topCol:"brown",pants:"black",boots:"black"},greet:["Un brick ? J\u2019en ai un. Il est cher. Il le vaut.","Les fr\xE9gates maudites r\xF4dent au sud. Prenez un bon navire."],shop:["billet_port","billet_havre","billet_anse","sloop","brick"],topics:[{q:"Les navires maudits ?",a:"Des bricks de noy\xE9s au nord et \xE0 l'ouest, des fr\xE9gates au sud, et dans les Brumes \xC9ternelles, le Galion Fant\xF4me du Comte. Ils tirent \xE0 vue sur tout ce qui flotte. Coulez-les : leurs cales sont pleines."}]},passeur_anse:{name:"P\xE9pin",title:"Passeur d\u2019Anse-Tranquille",look:{skin:1,hair:5,hairStyle:"court",top:"rayee",pants:"navy",boots:"brown",hat:"paille"},greet:["Bienvenue \xE0 l\u2019Anse ! Ici, m\xEAme les mouettes font la sieste."],shop:["billet_port","billet_havre","billet_rade"]},kerbrat:{name:"Vieux Kerbrat",title:"Ancien des Fr\xE8res de la C\xF4te",look:{skin:0,hair:4,hairStyle:"hirsute",beard:2,beardCol:4,top:"gilet",topCol:"red",pants:"black",boots:"black",hat:"bandana",hatCol:"red"},greet:["Un Fr\xE8re de la C\xF4te ne se bat jamais seul. C\u2019est la seule r\xE8gle.","Le Fort ? Il faut \xEAtre deux. Toujours."],topics:[{q:"Le Fort des Deux Cl\xE9s ?",a:"Deux dalles devant la porte : il faut un pirate sur chacune, en m\xEAme temps. \xC0 l'int\xE9rieur, Fer et Rouille. Tant qu'ils sont c\xF4te \xE0 c\xF4te, leurs armures se renvoient les coups. \xC9loignez-les l'un de l'autre, et frappez."}]},maelys:{name:"Ma\xEBlys",title:"P\xEAcheuse d\u2019Anse-Tranquille",look:{skin:2,hair:3,hairStyle:"long",top:"chemise",topCol:"white",pants:"navy",boots:"brown",hat:"paille"},greet:["Les maisons d\u2019ici sont \xE0 vendre, et la mer est calme. Enfin, presque.","Tu entends ? C\u2019est le lagon qui chante. Ne l\u2019\xE9coute pas trop."],shop:["sardine","poisson_grille","canne_peche","banane"],topics:[{q:"Habiter ici ?",a:"Six maisons \xE0 vendre, 800 doublons chacune. L'Anse est prot\xE9g\xE9e comme une ville : ni morts, ni duels. Les cambrioleurs, par contre..."}]},ermite:{name:"L\u2019Ermite",title:"Il a tout vu, tout oubli\xE9",look:{skin:1,hair:4,hairStyle:"hirsute",beard:2,beardCol:4,top:"haillons",topCol:"brown",pants:"brown",boots:"brown",hat:"paille"},greet:["Trois maisons, z\xE9ro voisin. Le paradis. Enfin, il y a les crabes.","Personne ne prot\xE8ge cet \xEElot. Ni Flamme, ni loi. Vous \xEAtes pr\xE9venu."]},agathe:{name:"S\u0153ur Agathe",title:"Derni\xE8re soignante de la Quarantaine",look:{skin:0,hair:1,hairStyle:"court",top:"tablier",topCol:"white",pants:"black",boots:"black",hat:"foulard",hatCol:"white"},greet:["Ne touchez \xE0 rien. Surtout pas aux morts.","La peste n\u2019a pas tu\xE9 cette colonie. Le Docteur, si."],shop:["bandage","elixir_flamme","grog","rhum"]},tailleur_rade:{name:"Rodrigue",title:"Marchand d\u2019\xE9toffes",look:{skin:1,hair:1,hairStyle:"queue",top:"gilet",topCol:"yellow",pants:"brown",boots:"brown",hat:"foulard",hatCol:"red"},greet:["Des habits de capitaine, cousus main. Le cuir et la soie, c\u2019est mon affaire."],shop:["tenue_boucanier","tenue_corsaire","tenue_brumes","tenue_peste","armure_conquistador","tenue_freres"]}});var Hn={ecurie:["ane","cheval","tortue_geante","crabe_geant","autruche","pur_sang"],armes:["fouet","dague_venin","marteau_pont","sabre_givre","lance_cavalerie","trident_orage","lame_executrice","sarbacane","boomerang","lance_grappin","tromblon_sel","pistolet_ricochet","pistolet_givre","pistolet_tonnerre"],noir:["sabre_midas","mousquet_vaudou","destrier_squelette","habit_gouverneur","anneau_vampire","collier_vaudou","trefle_or","boussole_vents","crochets","serrure_renforcee"]};Object.assign(wt,{reine:{name:"Isaure C\u0153ur-de-Sel",title:"Reine des Forbans de Libertalia",look:{skin:2,hair:4,hairStyle:"long",top:"capitaine",topCol:"purple",pants:"black",boots:"black",hat:"couronne",cape:"red"},greet:["Libertalia n\u2019a ni roi ni ma\xEEtre. Elle a une reine, ce qui n\u2019est pas pareil.","Parlez franchement. Ici, on pend les menteurs. Parfois.","Ma couronne est en fer-blanc, pirate. C\u2019est ma parole qui est en or."],topics:[{q:"Qu\u2019est-ce que Libertalia ?",a:"Une cit\xE9 o\xF9 chaque forban a une voix, qu'il soit n\xE9 noble, esclave ou b\xE2tard de capitaine. Aubin Sans-Ma\xEEtre l'a fond\xE9e il y a quarante ans, avec une r\xE8gle grav\xE9e sur la place : \xAB Ni roi, ni ma\xEEtre. \xBB Moi, on m'a \xE9lue. Nuance."},{q:"Qui est le Roi sans Couronne ?",a:"Le premier qui a voulu r\xE9gner sur nous. Il s'appelait Malo le Rouge. Les fondateurs l'ont renvers\xE9, puis enterr\xE9 sous le fort des Hauts... sans sa couronne. On l'a fondue pour payer les remparts. Depuis, on raconte qu'il la cherche encore."},{q:"Et la Mar\xE9e Morte ?",a:"Elle r\xE9veille ce qui devrait dormir. Les champs de canne, la mangrove, la jungle : tout ce qui est mort ici se rel\xE8ve. La cit\xE9 tient gr\xE2ce \xE0 ses murs et \xE0 ses gardes. Pour combien de temps ?"}]},capitaine_brisemer:{name:"Capitaine Brisemer",title:"Capitaine du Conseil \u2014 gardien de la Baie",look:{skin:3,hair:0,hairStyle:"chauve",beard:2,beardCol:4,top:"capitaine",topCol:"navy",pants:"navy",boots:"black",hat:"tricorne",hatCol:"navy"},greet:["Hmpf. Encore un h\xE9ros. Les h\xE9ros, \xE7a coule vite.","Ma baie sent la poudre et la noyade. J\u2019aime \xE7a.","Trente ans de mer. Pas un naufrage. Enfin, pas un des miens."],topics:[{q:"Les naufrageurs ?",a:"Des vivants, eux. Pire que les morts. Ils allument de fausses lumi\xE8res sur les rochers de la Baie, les navires croient voir le port, et crac. Ensuite ils pillent les \xE9paves. Leur chef se fait appeler Grand-Feu."}]},dame_corail:{name:"Dame Corail",title:"Capitaine du Conseil \u2014 ma\xEEtresse des comptoirs",look:{skin:1,hair:2,hairStyle:"long",top:"manteau",topCol:"teal",pants:"black",boots:"black",hat:"plume",hatCol:"teal"},greet:["Tout a un prix. Votre vie aussi, mais je ne l\u2019ach\xE8terais pas.","Le commerce, c\u2019est la guerre avec de meilleures mani\xE8res.","Mes navires rapportent plus d\u2019or que tous les tr\xE9sors de l\u2019archipel."],topics:[{q:"La contrebande ?",a:"Libertalia vit de la contrebande, ne soyons pas hypocrites. Mais les contrebandiers de la mangrove ne paient plus leur part. Ils sont morts, voyez-vous. Et les morts sont de tr\xE8s mauvais payeurs."}]},capitaine_fendlame:{name:"Capitaine Fendlame",title:"Capitaine du Conseil \u2014 commandant des Hauts",vis:{q:"lib_murmures",s:["locked","available","active","ready"]},look:{skin:0,hair:0,hairStyle:"queue",beard:1,beardCol:0,top:"manteau",topCol:"black",pants:"black",boots:"black",hat:"tricorne",hatCol:"red",eye:"patch"},greet:["L\u2019ordre. Voil\xE0 ce qui manque \xE0 cette cit\xE9. L\u2019ordre.","Je commande le fort des Hauts. Ou ce qu\u2019il en reste.","Une reine \xE9lue... Et demain, on \xE9lira le vent ?"],topics:[{q:"Le fort des Hauts ?",a:"Les anciens gardes y montent encore la garde. Morts, mais disciplin\xE9s. Ils tirent sur tout ce qui approche. Sous le fort, il y a une crypte que personne n'a ouverte depuis quarante ans. Personne. Retenez bien \xE7a."}]},palefrenier:{name:"Tobias",title:"Palefrenier des \xC9curies du Nord",look:{skin:1,hair:3,hairStyle:"hirsute",top:"gilet",topCol:"brown",pants:"brown",boots:"brown",hat:"paille"},greet:["Un \xE2ne pour commencer, un pur-sang pour finir. C\u2019est la vie.","Montez, appuyez sur C, et le monde r\xE9tr\xE9cit.","Ma tortue g\xE9ante ne court pas vite. Mais elle ne meurt jamais."],shop:Hn.ecurie,topics:[{q:"Comment monter ?",a:"Achetez une monture, \xE9quipez-la dans la case Monture de votre sac, puis C pour monter ou descendre. On ne se bat pas \xE0 cheval, et un coup vous fait tomber. Pour le reste, c'est le vent dans les cheveux."}]},armurier:{name:"M\xE2chefer",title:"Armurier du Sabre Courbe",look:{skin:3,hair:0,hairStyle:"chauve",beard:2,top:"tablier",topCol:"black",pants:"brown",boots:"black"},greet:["Mes armes ne coupent pas. Elles g\xE8lent, elles foudroient, elles empoisonnent.","Le givre d\u2019un sabre, le tonnerre d\u2019un pistolet... Choisissez votre mort pr\xE9f\xE9r\xE9e. Pour les autres.","Ici, on ne r\xE9pare pas. On vend du neuf."],shop:Hn.armes,topics:[{q:"Des armes \xE0 effets ?",a:"Le fouet ralentit, la dague empoisonne, le sabre de givre g\xE8le, le pistolet \xE0 ricochet rebondit d'un mort \xE0 l'autre, le tonnerre saute de cible en cible. Passez la souris sur une arme : je l'ai \xE9tiquet\xE9e, tout est \xE9crit."}]},tailleur_lib:{name:"Monsieur Fil-d\u2019Or",title:"Tailleur des Gentilshommes",look:{skin:0,hair:6,hairStyle:"queue",top:"gilet",topCol:"yellow",pants:"white",boots:"black",hat:"plume",hatCol:"yellow"},greet:["Un forban mal habill\xE9 est un forban \xE0 moiti\xE9 pendu.","De la soie, du velours, du cuir de requin. Rien que le meilleur.","Les bottes de sept lieues ? Cousues par moi. Les lieues, je ne garantis pas."],shop:["chapeau_plume","tenue_contrebandier","tenue_chasseur","uniforme_marine","tenue_vaudou","bottes_sept_lieues"]},apothicaire:{name:"M\xE8re Borgnefiole",title:"Apothicaire et faiseuse de miracles",look:{skin:2,hair:4,hairStyle:"hirsute",top:"vareuse",topCol:"green",pants:"black",boots:"brown",hat:"foulard",hatCol:"green"},greet:["Une fiole pour courir, une pour frapper, une pour ne pas mourir. Ou les trois.","Ne buvez jamais la verte \xE0 jeun.","J\u2019ai un \u0153il de verre. Il voit mieux que l\u2019autre."],shop:["antidote","fiole_celerite","potion_force","tonique_fer","bandage","elixir_flamme","fumigene","baton_vaudou"]},tav_rhum:{name:"Gros-Louis",title:"Tavernier du Rhum Borgne",look:{skin:0,hair:2,hairStyle:"court",beard:2,beardCol:2,top:"tablier",topCol:"white",pants:"brown",boots:"brown"},greet:["Ici, le rhum est vieux et les clients aussi.","Un verre ? Deux ? La bouteille ? Bon choix.","On ne se bat pas dans mon \xE9tablissement. On se bat dehors, comme des gens civilis\xE9s."],shop:["rhum","rhum_vieux","grog","poisson_grille","biscuit_mer"],topics:[{q:"Des rumeurs ?",a:"Le capitaine Fendlame passe beaucoup de temps aux Hauts, ces derniers temps. Seul. La nuit. Moi, je dis \xE7a, je dis rien. Je sers le rhum."}]},tav_sirene:{name:"Marisol",title:"Patronne de La Sir\xE8ne Ivre",look:{skin:2,hair:1,hairStyle:"long",top:"chemise",topCol:"red",pants:"red",boots:"black",hat:"foulard",hatCol:"yellow"},greet:["\xC0 La Sir\xE8ne Ivre, on chante faux mais on chante fort !","Ma soupe de tortue a ressuscit\xE9 un noy\xE9. Il est reparti m\xE9content.","Asseyez-vous, mon chou, vous avez une t\xEAte \xE0 avoir besoin d\u2019un grog."],shop:["rhum","grog","soupe_tortue","tarte_baies","galette_coco"]},tav_kraken:{name:"Ignace",title:"Tavernier du Kraken Saoul",look:{skin:1,hair:5,hairStyle:"hirsute",beard:1,top:"rayee",pants:"navy",boots:"black",hat:"bonnet",hatCol:"red"},greet:["Le Kraken Saoul ! Le seul kraken qu\u2019on peut regarder dans les yeux.","Les marins du port boivent ici. Et ils racontent tout.","Une bi\xE8re de varech ? Non ? Personne n\u2019en veut jamais."],shop:["rhum","grog","brochette_crabe","ragout_marin","biscuit_mer"]},tav_cale:{name:"La Mouche",title:"Tenancier de La Cale S\xE8che",look:{skin:3,hair:0,hairStyle:"court",top:"haillons",topCol:"grey",pants:"black",boots:"black",hat:"bandana",hatCol:"black"},greet:["Bienvenue aux Bas-Fonds. Gardez la main sur votre bourse.","Ici, on ne pose pas de questions. On vend des r\xE9ponses.","La nuit, les coupe-jarrets sortent. Le jour aussi, mais ils se cachent mieux."],shop:["rhum","rhum_vieux","fumigene","crochets"]},croupier:{name:"Fortun\xE9",title:"Croupier de La Bourse aux D\xE9s",dice:1,look:{skin:0,hair:1,hairStyle:"court",top:"gilet",topCol:"green",pants:"black",boots:"black",hat:"tricorne",hatCol:"green"},greet:["Faites vos jeux ! Le hasard est le seul juge honn\xEAte de Libertalia.","Deux d\xE9s, une mise. Battez mon total et je double votre or.","La maison gagne toujours. Sauf quand elle perd."],topics:[{q:"Les r\xE8gles ?",a:"Vous misez, chacun lance deux d\xE9s. Le plus haut total gagne : je vous rends le double de votre mise. Un double six, c'est le triple. \xC9galit\xE9 ? La maison gagne : il faut bien vivre. Mises de 10 \xE0 500 doublons."}]},joueur_lib:{name:"Lucien Sans-le-Sou",title:"Joueur ruin\xE9",look:{skin:0,hair:3,hairStyle:"hirsute",top:"chemise",topCol:"white",pants:"brown",boots:"brown"},greet:["J\u2019ai tout perdu. Mon navire, ma montre, ma chemise... Ah non, j\u2019ai encore ma chemise.","La prochaine partie sera la bonne. Je le sens.","Fortun\xE9 triche. Je ne sais pas comment, mais il triche."]},madame_rubis:{name:"Madame Rubis",title:"Ma\xEEtresse du Velours \xC9carlate",look:{skin:1,hair:4,hairStyle:"long",top:"chemise",topCol:"red",pants:"red",boots:"black",hat:"plume",hatCol:"purple"},greet:["Bienvenue au Velours, mon c\u0153ur. Ici, on boit, on \xE9coute la musique, et on oublie la mer.","Les capitaines viennent pour la compagnie. Ils repartent plus l\xE9gers... de leurs secrets.","Tenez-vous bien. Le Velours a des r\xE8gles, et des videurs."],shop:["rhum_vieux","grog"],topics:[{q:"Qu\u2019est-ce que le Velours ?",a:"Le salon le plus \xE9l\xE9gant de l'archipel. Du vin, de la musique, de belles personnes et de bonnes conversations. Ce qui se dit au Velours reste au Velours. Sauf quand \xE7a m'arrange."}]},perle:{name:"Perle",title:"Courtisane du Velours",look:{skin:2,hair:0,hairStyle:"long",top:"chemise",topCol:"purple",pants:"purple",boots:"black",hat:"foulard",hatCol:"purple"},greet:["Vous avez l\u2019air d\u2019avoir besoin de conversation. Ou d\u2019un bain.","Les capitaines parlent beaucoup quand ils ont bu. Moi, j\u2019\xE9coute.","Un sourire, \xE7a ne co\xFBte rien. Le reste se discute."]},celeste:{name:"C\xE9leste",title:"Chanteuse du Velours",look:{skin:0,hair:6,hairStyle:"long",top:"chemise",topCol:"teal",pants:"teal",boots:"black"},greet:["La-la-la... Pardon, je r\xE9p\xE8te. Ce soir, je chante \xAB La Ballade de Malo le Rouge \xBB.","On dit que ma voix calme les morts. Je n\u2019ai jamais os\xE9 v\xE9rifier.","Une chanson pour le pirate qui s\u2019ennuie ?"]},le_borgne:{name:"Le Borgne",title:"March\xE9 noir \u2014 on ne l\u2019a jamais vu ici",look:{skin:2,hair:0,hairStyle:"court",beard:1,beardCol:0,top:"manteau",topCol:"black",pants:"black",boots:"black",hat:"cagoule",hatCol:"black",eye:"patch"},greet:["Fermez la porte. Doucement.","Ce que je vends n\u2019existe pas. Ce que vous payez, si.","Le sabre de Midas, le destrier d\u2019os, le mousquet vaudou... Les l\xE9gendes ont un prix."],shop:Hn.noir,topics:[{q:"D\u2019o\xF9 vient tout \xE7a ?",a:"D'\xE9paves, de tombes, de cales de navires qui ne rentreront jamais. Je ne vole personne. Les morts n'ont plus besoin de rien."}]},charpentier_lib:{name:"Ma\xEEtre Calfat",title:"Charpentier de marine",look:{skin:3,hair:4,hairStyle:"court",beard:2,beardCol:4,top:"tablier",topCol:"brown",pants:"navy",boots:"black",hat:"bonnet",hatCol:"navy"},greet:["Un radeau pour p\xEAcher, une go\xE9lette pour filer, un galion pour r\xE9gner sur la mer.","Ma go\xE9lette remonte au vent comme une mouette.","Le galion ? Seize mille doublons. Et il les vaut, mousse."],shop:["radeau","barque","sloop","goelette","brick","galion","veuve_ecarlate"],topics:[{q:"Quel navire choisir ?",a:"Le radeau, c'est pour le lagon. La go\xE9lette est la plus rapide de l'archipel. Le galion est lent, mais ses canons coulent une fr\xE9gate maudite en trois bord\xE9es. Placez votre navire dans l'eau depuis votre sac."}]},capitaine_port:{name:"Capitaine Esteban",title:"Capitaine du port",look:{skin:2,hair:1,hairStyle:"court",beard:1,top:"manteau",topCol:"navy",pants:"white",boots:"black",hat:"tricorne",hatCol:"navy"},greet:["Le port de Libertalia accueille tous les pavillons. Surtout les noirs.","Amarrez proprement, payez la taxe, et souriez.","Une longue-vue ? Indispensable. On voit venir les ennuis de plus loin."],shop:["longue_vue","conque_rappel","carte_dechiree"]},maitre_fosse:{name:"Brise-Os",title:"Ma\xEEtre de la Fosse",arena:1,look:{skin:3,hair:0,hairStyle:"chauve",beard:2,beardCol:0,top:"armure",topCol:"grey",pants:"black",boots:"black",hat:"morion"},greet:["La Fosse ! Ici, on se bat pour l\u2019or, la gloire, et parfois pour rien.","Tu as des \xE9paules. Voyons si tu as des tripes.","Le dernier champion ? Il est dans les gradins. En morceaux."]},passeur_lib:{name:"N\xE9r\xE9e",title:"Passeuse de Libertalia",look:{skin:2,hair:2,hairStyle:"queue",top:"vareuse",topCol:"yellow",pants:"brown",boots:"brown",hat:"bonnet",hatCol:"yellow"},greet:["Port-Lanterne, Havre-des-Brumes, la Rade, l\u2019Anse : j\u2019y vais par tous les temps.","Mon bateau est petit, mais il conna\xEEt le chemin."],shop:["billet_port","billet_havre","billet_rade","billet_anse"]},marchande_fruits:{name:"Manon",title:"Marchande de fruits",look:{skin:2,hair:3,hairStyle:"long",top:"chemise",topCol:"yellow",pants:"green",boots:"brown",hat:"paille"},greet:["Mangues, bananes, noix de coco ! Tout frais, tout juste vol\xE9... euh, cueilli !","Un fruit par jour \xE9loigne le scorbut !"],shop:["banane","noix_coco","baies","galette_coco","tarte_baies"]},poissonnier_lib:{name:"Yvon",title:"Poissonnier",look:{skin:0,hair:4,hairStyle:"court",beard:2,beardCol:4,top:"tablier",topCol:"white",pants:"navy",boots:"black",hat:"bonnet",hatCol:"navy"},greet:["Sardines du matin, poisson grill\xE9 du midi, soupe de tortue du soir !","Il est frais mon poisson ! Il est mort, mais frais !"],shop:["sardine","poisson_grille","soupe_tortue","canne_peche"]},marchand_curios:{name:"Z\xE9phyrin",title:"Marchand de curiosit\xE9s",look:{skin:1,hair:6,hairStyle:"long",top:"manteau",topCol:"purple",pants:"black",boots:"brown",hat:"foulard",hatCol:"purple"},greet:["Un singe chapardeur ? Un perroquet qui jure en trois langues ? Un chaton porte-bonheur ?","Tout ce qui est bizarre finit chez moi."],shop:["chaton","perroquet_vert","singe","longue_vue","collier_coquillages","carte_dechiree"]},marchand_rhum:{name:"Rosalie",title:"Marchande de rhum",look:{skin:3,hair:2,hairStyle:"queue",top:"gilet",topCol:"orange",pants:"brown",boots:"brown",hat:"bandana",hatCol:"orange"},greet:["Le meilleur rhum de l\u2019\xEEle vient des Cannaies. Enfin, venait.","Rhum blanc, rhum vieux, grog chaud : approchez !"],shop:["rhum","rhum_vieux","grog"]},crieur:{name:"Hector le Crieur",title:"Crieur public",look:{skin:0,hair:1,hairStyle:"court",top:"manteau",topCol:"red",pants:"black",boots:"black",hat:"tricorne",hatCol:"red"},greet:["OYEZ, OYEZ ! La Reine tiendra conseil ce soir au palais !","OYEZ ! Prime sur les naufrageurs de la Baie ! Voir le tableau, sur la place !","OYEZ ! Les duels sont interdits dans l\u2019enceinte ! Les paris, non !","OYEZ ! On recherche un chat roux. Il r\xE9pond au nom de Capitaine."]},primes_lib:{name:"Tableau des primes",title:"Conseil des Capitaines de Libertalia",board:1,greet:["AVIS : le Conseil paie comptant chaque menace renvoy\xE9e au repos. Ou au fond.","Les avis sont clou\xE9s au poignard. Certains ont du sang s\xE9ch\xE9 dessus."],topics:[]},garde_porte:{name:"Sergent M\xE2choire",title:"Garde de la Porte du Nord",look:{skin:1,hair:0,hairStyle:"court",beard:1,top:"armure",topCol:"red",pants:"black",boots:"black",hat:"morion"},greet:["Halte ! Ah, un vivant. Entrez.","Pas de duel dans l\u2019enceinte. Pas de morts non plus. Ni de chats roux, depuis hier.","La nuit, les portes restent ouvertes. Les remparts suffisent. Enfin, j\u2019esp\xE8re."],topics:[{q:"Que voir \xE0 Libertalia ?",a:"Le palais de la Reine au nord, la place de la Libert\xE9 au centre, le march\xE9 juste en dessous, les tavernes sur la rue du milieu, le Velours \xC9carlate \xE0 l'ouest, le port au sud. Et les Bas-Fonds, \xE0 l'est... mais l\xE0, gardez la main sur votre sabre."}]},mendiant:{name:"Le Vieux Sou",title:"Mendiant aveugle (en principe)",look:{skin:1,hair:4,hairStyle:"hirsute",beard:2,beardCol:4,top:"haillons",topCol:"brown",pants:"brown",boots:"grey"},greet:["Une pi\xE8ce pour un pauvre aveugle ? ... Belle chemise, au fait.","Je ne vois rien. Mais j\u2019entends tout.","Les murs de Libertalia ont des oreilles. Moi aussi."]},musicien:{name:"Ga\xE9tan",title:"Violoneux des rues",look:{skin:0,hair:3,hairStyle:"long",top:"gilet",topCol:"red",pants:"navy",boots:"brown",hat:"paille"},greet:["\u266A Libertalia, cit\xE9 sans ma\xEEtre, ses rues sont larges, ses c\u0153urs aussi... \u266A","Une pi\xE8ce, une chanson. Deux pi\xE8ces, je m\u2019arr\xEAte.","\u266A Malo le Rouge voulait une couronne... on la lui a fondue en canons... \u266A"]}});var Mu=wt.silas.look;Object.assign(wt,{brechet:{name:"Anatole Br\xE9chet",title:"Comptable d\u2019Octave Valdorne",look:{skin:0,hair:4,hairStyle:"chauve",beard:0,top:"gilet",topCol:"black",pants:"black",boots:"black"},greet:["Hm ? Je compte. Revenez quand j\u2019aurai fini. C\u2019est-\xE0-dire jamais.","Valdorne me paie au sou pr\xE8s. Je bois au sou pr\xE8s.","Les d\xE9s, au moins, ne trichent pas. Eux."],topics:[{q:"Vous travaillez pour Valdorne ?",a:"Vingt-deux ans de colonnes et de chiffres. Je sais ce qu'il poss\xE8de mieux que lui. Il ne sait pas ce que je bois."},{q:"Cette cl\xE9 \xE0 votre ceinture ?",a:"\xC7a ? \xC7a ne vous regarde pas. Et \xE7a ne quitte pas ma ceinture. Sauf pour aller au lit. Et encore."}]},lafleur:{name:"Corvin Lafleur",title:"Architecte",look:{skin:0,hair:3,hairStyle:"long",top:"chemise",topCol:"white",pants:"brown",boots:"brown",hat:"foulard",hatCol:"teal"},greet:["Ne touchez \xE0 rien : tout est \xE0 l\u2019\xE9chelle.","Un mur porteur ne se discute pas. Un prix, si.","J\u2019ai b\xE2ti la moiti\xE9 des belles maisons du port. Et je les connais toutes par c\u0153ur."],topics:[{q:"Vous avez b\xE2ti la demeure de Valdorne ?",a:"Ma plus belle commande. Et la pire : il a voulu des murs \xE9pais comme des remparts et une salle des archives sans fen\xEAtre. J'ai tout de m\xEAme mis une fen\xEAtre. Ne le dites pas."}]},valdorne:{name:"Octave Valdorne",title:"N\xE9gociant",vis:{lvl:17},look:{skin:0,hair:4,hairStyle:"court",beard:2,top:"capitaine",topCol:"red",pants:"black",boots:"black",hat:"tricorne",hatCol:"black"},greet:["Bienvenue sous mon toit. Ne touchez pas aux tableaux, ils valent plus que votre navire.","Le commerce, mon ami, c\u2019est savoir qui doit quoi \xE0 qui.","Ma vente commencera bient\xF4t. Prenez un verre en attendant."],topics:[{q:"Que vendez-vous ce soir ?",a:"Des curiosit\xE9s. Des cartes. Des secrets bien rang\xE9s. Tout ce qui a un prix \u2014 c'est-\xE0-dire tout."}]},ferrant:{name:"Capitaine Ferrant",title:"Invit\xE9, un peu gris",vis:{lvl:17},look:{skin:2,hair:1,hairStyle:"hirsute",beard:1,top:"capitaine",topCol:"navy",pants:"navy",boots:"black",hat:"capitaine",hatCol:"navy"},greet:["Encore un verre ! Valdorne paie, Valdorne paie toujours !","Vous \xEAtes qui, vous ? Vous avez une t\xEAte de quelqu\u2019un.","Ma femme danse trop bien. Avec trop de monde."],topics:[]},corail:{name:"Madame Corail",title:"Marchande des Sept Courants",look:{skin:3,hair:2,hairStyle:"long",top:"gilet",topCol:"teal",pants:"white",boots:"brown",hat:"foulard",hatCol:"orange"},greet:["Bienvenue sur la seule \xEEle que les cartes ont oubli\xE9e.","Si vous \xEAtes ici, c\u2019est que Silas vous aime bien. Ou qu\u2019il vous doit beaucoup.","Ici, pas de Douane. Rien que des courants."],shop:["rhum_vieux","longue_vue","carte_tresor","fumigene","grog"],topics:[{q:"Comment \xEAtes-vous arriv\xE9e ici ?",a:"Par les Sept Courants, comme vous. Il y a trente ans. Je n'ai jamais trouv\xE9 de raison de repartir."}]},silas_geole:{name:"Silas Virevent",title:"Prisonnier",look:Mu,vis:{q:"br_fin_denoncer",s:["done"]},greet:["Tiens, mon ge\xF4lier pr\xE9f\xE9r\xE9. Tu viens me voir pourrir ?","Valdorne vendra ta liste \xE0 un autre, tu sais. Il y aura toujours un autre Silas.","J\u2019aurais fait pareil. Enfin\u2026 j\u2019ai fait pareil."],topics:[{q:"Des regrets ?",a:"Un seul : t'avoir choisi. Tu \xE9tais trop bon. C'est rare, chez nous."}]}});wt.fouine.shop.push("des_pipes");wt.silas.vis={lvl:17,notDone:["br_fin_garder","br_fin_denoncer"]};for(let t of["passeur","passeur_havre","passeur_rade","passeur_anse"])wt[t].shop.push("billet_libertalia");wt.passeur.shop.push("radeau","ane");for(let[t,e]of Object.entries(Vi))wt[t]&&(wt[t].remember=e);wt.silas.remember=[["m:br_route","Associ\xE9 ! Une caisse ou deux pour Madame Corail ? Les courants sont calmes, ce soir."],...wt.silas.remember||[]];wt.fouine.remember=[["m:br_denonce","Toi. Tu as vendu des noms \xE0 Valdorne. On n\u2019oublie pas \xE7a, sur les quais. Mes crochets restent \xE0 vendre\u2026 pour les autres."],...wt.fouine.remember||[]];wt.vif_quai&&(wt.vif_quai.remember=[["m:br_denonce","Il para\xEEt que tu travailles pour Valdorne, maintenant. Dommage. Je t\u2019aimais bien."],...wt.vif_quai.remember||[]]);Object.assign(wt,{mira:{name:"Mira Bell\xE9cume",title:"Organisatrice de la Nuit des Mille Voiles",look:{skin:1,hair:5,hairStyle:"long",top:"capitaine",topCol:"purple",pants:"white",boots:"brown",hat:"plume",hatCol:"orange"},greet:["La f\xEAte, c\u2019est s\xE9rieux. Tr\xE8s s\xE9rieux. Presque autant que le rhum.","Ma grand-m\xE8re disait : on ne bat pas la Mar\xE9e Morte avec des canons, on la bat avec des chansons.","Vous avez votre carnet ? Montrez-moi vos tampons !"],topics:[{q:"Qu\u2019est-ce que la Nuit des Mille Voiles ?",a:"Le jour o\xF9 Port-Lanterne a surv\xE9cu \xE0 sa premi\xE8re Mar\xE9e Morte, tous les navires du port ont hiss\xE9 leurs voiles, m\xEAme les barques, m\xEAme les draps. Mille voiles. Depuis, chaque semaine, on recommence."},{q:"Comment gagne-t-on des jetons ?",a:"Aux six \xE9preuves ! La premi\xE8re r\xE9ussite de la semaine vaut un tampon et beaucoup de jetons ; apr\xE8s, on en gagne un peu chaque fois, jusqu\u2019\xE0 une certaine heure\u2026 que je ne vous dirai pas. Et chaque nuit, le spectacle en donne aussi."},{q:"Et votre grand-m\xE8re ?",a:"Elle a cach\xE9 un coffre quelque part dans le port, avec des \xE9nigmes partout. Je ne l\u2019ai jamais ouvert moi-m\xEAme : je pr\xE9f\xE8re regarder les autres chercher."}]},zephyrine:{name:"Z\xE9phyrine Pompon",title:"Comptoir des jetons du festival",look:{skin:0,hair:2,hairStyle:"queue",top:"gilet",topCol:"yellow",pants:"brown",boots:"brown",hat:"foulard",hatCol:"purple"},greet:["Des voiles, des pavillons, des tenues ! Tout se paie en jetons du festival.","Les jetons, je les garde d\u2019une semaine \xE0 l\u2019autre. Comme les secrets."],topics:[{q:"Que vendez-vous ?",a:"Des parures : rien qui frappe plus fort, tout ce qui brille plus fort. Les voiles et les pavillons vont sur vos navires, les tenues sur vous, les \xE9motes\u2026 sur vous aussi, en dansant."}]},anselin:{name:"Anselin",title:"Ma\xEEtre de la Course des Mille Voiles",fest:1,look:{skin:2,hair:3,hairStyle:"court",beard:2,top:"vareuse",topCol:"navy",pants:"white",boots:"black",hat:"capitaine",hatCol:"navy"},greet:["Pas de navire ? Je vous pr\xEAte un cotre. Le vent, lui, est gratuit.","Huit bou\xE9es, une ligne, et toute la mer entre les deux."],topics:[{q:"Comment se court la course ?",a:"On s\u2019inscrit, et le d\xE9part est donn\xE9 trente secondes plus tard, pour tous ceux qui sont inscrits. Franchissez la ligne au sud de la jet\xE9e, passez les bou\xE9es dans l\u2019ordre, revenez par la ligne. Les courants vous aident ou vous freinent ; lisez la mer. Votre propre navire ? Il court en temps compens\xE9 : plus il est rapide, plus son temps est major\xE9."}]},gaston:{name:"Gaston M\xE8che",title:"Chef canonnier du festival",fest:1,look:{skin:1,hair:4,hairStyle:"chauve",beard:1,top:"chemise",topCol:"red",pants:"brown",boots:"black",hat:"bonnet",hatCol:"red"},greet:["Trois canons, trois couloirs. Visez devant ce qui bouge.","Les mouettes de bois valent trois points. Les vraies, rien : on ne tire pas sur les vraies."],topics:[{q:"Comment joue-t-on ?",a:"Approchez-vous d\u2019un canon et appuyez sur E. Pendant quarante-cinq secondes, visez \xE0 la souris et cliquez : le boulet met un instant \xE0 tomber, alors visez l\xE0 o\xF9 la cible SERA. Huit points, et vous avez votre tampon."}]},pimprenelle:{name:"Pimprenelle",title:"Gabi\xE8re, gardienne du parcours",fest:1,look:{skin:0,hair:1,hairStyle:"queue",top:"rayee",topCol:"navy",pants:"white",boots:"brown",hat:"bandana",hatCol:"teal"},greet:["Sautez, grimpez, glissez. Et ne vous arr\xEAtez pas devant les tonneaux : ils, eux, ne s\u2019arr\xEAtent pas.","Mon record ? Quarante et une secondes. Mais j\u2019ai trich\xE9 : je connais le parcours."],topics:[{q:"Comment se fait le parcours ?",a:"Entrez par mon stand, prenez le d\xE9part au panneau : le chrono part \xE0 la ligne. Sautez le bras d\u2019eau, filez sur le long quai entre les tonneaux qui roulent, balancez-vous \xE0 la corde, grimpez au m\xE2t, glissez le long de l\u2019\xE9tai, passez sous la b\xF4me, traversez la planche, et sonnez la cloche. Touch\xE9 ? Retour au dernier point de reprise, pas plus."}]},barnabe:{name:"Barnab\xE9 Tire-Bouchon",title:"Ma\xEEtre du d\xE9fi des tavernes",
